<!DOCTYPE html>
<html>
<!-- THEME_SLOT -->
<head>
<meta charset="utf-8">
<title>Type Chart</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    background: rgba(5, 15, 30, 0.92);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #ddd;
    font-size: 11px;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    padding: 10px;
    overflow: auto;
}
h1 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #88aaee;
    margin-bottom: 8px;
}
table { border-collapse: collapse; }
th, td {
    width: 28px; height: 20px;
    text-align: center; vertical-align: middle;
    font-size: 9px;
    border: 1px solid rgba(255,255,255,0.06);
}
th { font-weight: 700; color: #aac; background: rgba(255,255,255,0.05); }
th.atk { color: #ffcc66; writing-mode: vertical-lr; transform: rotate(180deg); height: 52px; }
.corner { background: transparent; border: none; }
td.x2  { background: #1a5c1a; color: #66ee66; font-weight: 700; }
td.x05 { background: #5c1a1a; color: #ee6666; font-weight: 700; }
td.x0  { background: #1a1a2a; color: #4444aa; font-weight: 700; }
td.x1  { background: transparent; color: #333; }
#legend {
    display: flex; gap: 16px; margin-top: 8px; font-size: 10px;
}
.leg { display: flex; align-items: center; gap: 4px; }
.leg span { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
html[data-theme=light] html, html[data-theme=light] body {
    background: rgba(240,248,255,0.95);
    color: #111;
}
html[data-theme=light] h1 { color: #2244aa; }
html[data-theme=light] th { color: #333; background: rgba(0,0,0,0.06); }
html[data-theme=light] th.atk { color: #aa6600; }
html[data-theme=light] td.x2  { background: #c8f0c8; color: #1a5c1a; }
html[data-theme=light] td.x05 { background: #f0c8c8; color: #7a1a1a; }
html[data-theme=light] td.x0  { background: #d8d8e8; color: #4444aa; }
</style>
</head>
<body>
<h1>Gen III Type Chart</h1>
<div id="chart"></div>
<div id="legend">
  <div class="leg"><span style="background:#1a5c1a"></span> 2×</div>
  <div class="leg"><span style="background:#5c1a1a"></span> ½×</div>
  <div class="leg"><span style="background:#1a1a2a"></span> 0×</div>
</div>
<script>
// Gen III type effectiveness chart (attacking→defending).
// Types: NRM FGT FLY PSN GND ROK BUG GHO STL FIR WAT GRS ELC PSY ICE DRG DRK
const T = ["NRM","FGT","FLY","PSN","GND","ROK","BUG","GHO","STL","FIR","WAT","GRS","ELC","PSY","ICE","DRG","DRK"];
// Rows = attacker, Cols = defender
// Values: 2=super, 5=not very (½), 0=immune, 1=normal
const E = [
//       NRM FGT FLY PSN GND ROK BUG GHO STL FIR WAT GRS ELC PSY ICE DRG DRK
/* NRM */ [1,  1,  1,  1,  1,  5,  1,  0,  5,  1,  1,  1,  1,  1,  1,  1,  1],
/* FGT */ [2,  1,  5,  5,  1,  2,  5,  0,  2,  1,  1,  1,  1,  5,  2,  1,  2],
/* FLY */ [1,  2,  1,  1,  1,  5,  2,  1,  5,  1,  1,  2,  5,  1,  1,  1,  1],
/* PSN */ [1,  1,  1,  5,  5,  5,  1,  5,  0,  1,  1,  2,  1,  1,  1,  1,  1],
/* GND */ [1,  1,  0,  2,  1,  2,  5,  1,  2,  2,  1,  5,  2,  1,  1,  1,  1],
/* ROK */ [1,  5,  2,  1,  5,  1,  2,  1,  5,  2,  1,  1,  1,  1,  2,  1,  1],
/* BUG */ [1,  5,  5,  5,  1,  1,  1,  5,  5,  5,  1,  2,  1,  2,  1,  1,  2],
/* GHO */ [0,  1,  1,  1,  1,  1,  1,  2,  5,  1,  1,  1,  1,  2,  1,  1,  5],
/* STL */ [1,  1,  1,  1,  1,  2,  1,  1,  5,  5,  5,  1,  5,  1,  2,  1,  1],
/* FIR */ [1,  1,  1,  1,  1,  5,  2,  1,  2,  5,  5,  2,  1,  1,  2,  5,  1],
/* WAT */ [1,  1,  1,  1,  2,  2,  1,  1,  1,  2,  5,  5,  1,  1,  1,  5,  1],
/* GRS */ [1,  1,  5,  5,  2,  2,  5,  1,  5,  5,  2,  5,  1,  1,  1,  5,  1],
/* ELC */ [1,  1,  2,  1,  0,  1,  1,  1,  1,  1,  2,  5,  5,  1,  1,  5,  1],
/* PSY */ [1,  2,  1,  2,  1,  1,  1,  1,  5,  1,  1,  1,  1,  5,  1,  1,  0],
/* ICE */ [1,  1,  2,  1,  2,  1,  1,  1,  5,  5,  5,  2,  1,  1,  5,  2,  1],
/* DRG */ [1,  1,  1,  1,  1,  1,  1,  1,  5,  1,  1,  1,  1,  1,  1,  2,  1],
/* DRK */ [1,  5,  1,  1,  1,  1,  1,  2,  5,  1,  1,  1,  1,  2,  1,  1,  5],
];

const table = document.createElement('table');
// Header row (defending types)
const hdr = document.createElement('tr');
const c0 = document.createElement('th');
c0.className = 'corner';
c0.setAttribute('colspan', '2');
hdr.appendChild(c0);
T.forEach(t => {
    const th = document.createElement('th');
    th.textContent = t.substring(0,3);
    th.title = 'Defending: ' + t;
    hdr.appendChild(th);
});
table.appendChild(hdr);

// Data rows
E.forEach((row, ai) => {
    const tr = document.createElement('tr');
    const th = document.createElement('th');
    th.className = 'atk';
    th.textContent = T[ai].substring(0,3);
    th.title = 'Attacking: ' + T[ai];
    tr.appendChild(th);
    row.forEach(v => {
        const td = document.createElement('td');
        if      (v === 2) { td.className = 'x2';  td.textContent = '2'; }
        else if (v === 5) { td.className = 'x05'; td.textContent = '½'; }
        else if (v === 0) { td.className = 'x0';  td.textContent = '0'; }
        else              { td.className = 'x1';  td.textContent = ''; }
        tr.appendChild(td);
    });
    table.appendChild(tr);
});

document.getElementById('chart').appendChild(table);
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<!-- THEME_SLOT -->
<head>
<meta charset="utf-8">
<title>Badge Progress</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    background: transparent;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #fff;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
}
#panel {
    background: rgba(10, 10, 20, 0.88);
    border: 1px solid rgba(180, 140, 60, 0.4);
    border-radius: 10px;
    padding: 10px 18px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.7);
}
#label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: #bb9944; margin-bottom: 8px;
}
#dots {
    display: flex; gap: 8px; align-items: center; justify-content: center;
}
.dot {
    width: 18px; height: 18px; border-radius: 50%;
    transition: background 0.3s, box-shadow 0.3s;
}
.dot.on  { background: #ffd040; box-shadow: 0 0 8px rgba(255, 210, 30, 0.7); }
.dot.off { background: #333; }
#count {
    font-size: 12px; color: #aaa; margin-top: 8px; font-weight: 600;
}
#disconnected { display: none; font-size: 11px; color: #666; margin-top: 4px; }
html[data-theme=light] #panel {
    background: rgba(250, 245, 225, 0.93);
    border-color: rgba(150, 110, 20, 0.45);
    color: #222;
}
html[data-theme=light] #label { color: #8a6a10; }
html[data-theme=light] .dot.off { background: #ccc; }
html[data-theme=light] #count { color: #555; }
</style>
</head>
<body>
<div id="panel">
  <div id="label">Badges</div>
  <div id="dots"></div>
  <div id="count">0 / 8</div>
  <div id="disconnected">disconnected</div>
</div>
<script>
const _pathParts  = window.location.pathname.split('/').filter(Boolean);
const _pathIndex  = parseInt(_pathParts[0]);
const _params     = new URLSearchParams(window.location.search);
const _explicitIndex = !isNaN(_pathIndex) ? _pathIndex
    : (_params.has('slot') ? parseInt(_params.get('slot')) : null);
let playerIndex = _explicitIndex !== null ? _explicitIndex : 0;
function resolvePlayerIndex(slots) {
    if (_explicitIndex !== null) return;
    const first = slots.findIndex(s => s && s.connected);
    if (first !== -1) playerIndex = first;
}

function handleState(slots) {
    resolvePlayerIndex(slots);
    const slot   = slots[playerIndex];
    const dotsEl = document.getElementById('dots');
    const countEl= document.getElementById('count');
    const discEl = document.getElementById('disconnected');
    if (!slot || !slot.connected) {
        discEl.style.display = '';
        return;
    }
    discEl.style.display = 'none';
    const badges = slot.badges || [];
    dotsEl.innerHTML = '';
    for (const b of badges) {
        const d = document.createElement('div');
        d.className = 'dot ' + (b ? 'on' : 'off');
        dotsEl.appendChild(d);
    }
    const earned = badges.filter(Boolean).length;
    countEl.textContent = earned + ' / ' + badges.length;
}

let ws;
let reconnectDelay = 1000;
function connect() {
    ws = new WebSocket('ws://' + location.host + '/ws?show=badges');
    ws.onopen    = () => { reconnectDelay = 1000; };
    ws.onmessage = e => handleState(JSON.parse(e.data));
    ws.onclose   = () => { setTimeout(connect, reconnectDelay); reconnectDelay = Math.min(reconnectDelay * 2, 30000); };
}
connect();
</script>
</body>
</html>

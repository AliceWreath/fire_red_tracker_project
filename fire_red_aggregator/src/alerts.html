<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Zone Alert</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    background: transparent;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    width: 100%; height: 100%;
    overflow: hidden;
}
/* Shared position and chrome for all alert toasts — top-left */
#zone-toast, #death-toast, #shiny-toast, #wipe-toast {
    position: fixed; top: 12px; left: 12px;
    border-radius: 8px; padding: 10px 16px;
    max-width: 340px; min-width: 220px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.8);
    z-index: 9998; pointer-events: none;
    opacity: 0; transition: opacity 0.4s ease;
}
#zone-toast.visible, #death-toast.visible, #shiny-toast.visible, #wipe-toast.visible {
    opacity: 1;
}
/* Per-toast colours */
#zone-toast  { background: rgba(10, 10, 30, 0.93); border: 1px solid rgba(100, 160, 255, 0.35); }
#death-toast { background: rgba(40,  5,  5, 0.95); border: 1px solid rgba(255,  80,  80, 0.5);  }
#shiny-toast { background: rgba(30, 25,  5, 0.96); border: 1px solid rgba(255, 210,  50, 0.6);  }
#wipe-toast  { background: rgba(60,  0,  0, 0.97); border: 1px solid #cc2222; text-align: center; transition: opacity 0.5s ease; z-index: 9999; }
/* Zone toast content */
.zt-zone        { font-size: 13px; font-weight: bold; color: #8ecfff; margin-bottom: 4px; }
.zt-status      { font-size: 11px; color: #e0b060; font-weight: 600; margin-bottom: 3px; }
.zt-prev        { font-size: 11px; color: #bbb; }
.zt-prev-caught { color: #60e060; font-weight: 600; }
.zt-prev-failed { color: #e06060; font-weight: 600; }
.zt-cap-warn    { font-size: 11px; color: #ffaa33; font-weight: 600; margin-top: 3px; }
/* Death toast content */
.dt-label { font-size: 12px; font-weight: bold; color: #ff5555; margin-bottom: 3px; }
.dt-name  { font-size: 13px; font-weight: bold; color: #ffaaaa; }
.dt-sub   { font-size: 11px; color: #cc8888; margin-top: 2px; }
/* Shiny toast content */
.st-label { font-size: 13px; font-weight: bold; color: #ffd700; margin-bottom: 3px; }
.st-name  { font-size: 12px; color: #ffe98a; }
/* Wipe toast content */
.wt-label { font-size: 15px; font-weight: bold; color: #ff4444; margin-bottom: 4px; }
.wt-sub   { font-size: 11px; color: #cc8888; }
</style>
</head>
<body>
<div id="zone-toast">
  <div class="zt-zone"   id="zt-zone-name"></div>
  <div class="zt-status" id="zt-status"></div>
  <div class="zt-prev"   id="zt-prev-line"></div>
  <div class="zt-cap-warn" id="zt-cap-warn" style="display:none"></div>
</div>
<div id="death-toast">
  <div class="dt-label">FAINTED</div>
  <div class="dt-name" id="dt-name"></div>
  <div class="dt-sub"  id="dt-sub"></div>
</div>
<div id="shiny-toast">
  <div class="st-label">✨ SHINY ENCOUNTER!</div>
  <div class="st-name" id="st-name"></div>
</div>
<div id="wipe-toast">
  <div class="wt-label">PARTY WIPED — RUN ENDED</div>
  <div class="wt-sub"  id="wt-sub"></div>
</div>
<script>
// Player slot index — path takes priority (/0/alerts), falls back to ?slot=N, then 0
const _pathParts  = window.location.pathname.split('/').filter(Boolean);
const _pathIndex  = parseInt(_pathParts[0]);
const _params     = new URLSearchParams(window.location.search);
const playerIndex = !isNaN(_pathIndex) ? _pathIndex : parseInt(_params.get('slot') || '0');

let _lastZoneKey = '';
let _toastTimer  = null;

// Shows the zone-entry toast.
// alreadyEncountered — true if this area already has a recorded encounter this run.
// thisRunEnc         — the db_encounters entry for this area (if already encountered).
// prevEnc            — the prev_run_encounters entry for this area (if any).
// capWarn            — the next gym max level if encounters reach it, else null.
function showZoneToast(zoneName, alreadyEncountered, thisRunEnc, prevEnc, capWarn) {
    const toast  = document.getElementById('zone-toast');
    const zoneEl = document.getElementById('zt-zone-name');
    const statEl = document.getElementById('zt-status');
    const prevEl = document.getElementById('zt-prev-line');
    const capEl  = document.getElementById('zt-cap-warn');

    zoneEl.textContent = 'Entering area: ' + zoneName;

    // Clear dynamic children before repopulating.
    statEl.textContent = '';
    prevEl.textContent = '';
    prevEl.className   = 'zt-prev';
    capEl.style.display = 'none';

    if (alreadyEncountered && thisRunEnc) {
        // Already had the encounter here — show what happened.
        statEl.className = 'zt-status';
        const caught  = thisRunEnc.caught;
        const label   = caught ? 'Caught' : 'Encountered';
        const cls     = caught ? 'zt-prev-caught' : 'zt-prev-failed';
        const span    = document.createElement('span');
        span.className   = cls;
        span.textContent = label + ': ' + thisRunEnc.species_name + ' (Lv.' + thisRunEnc.level + ')';
        statEl.appendChild(span);
        if (!caught) {
            statEl.appendChild(document.createTextNode(' — not caught'));
        }
    } else {
        // No encounter here yet this run.
        statEl.className = 'zt-status';
        statEl.textContent = 'No first encounter yet this run.';

        if (prevEnc) {
            const action = prevEnc.caught ? 'caught' : 'encountered but failed to catch';
            const cls    = prevEnc.caught ? 'zt-prev-caught' : 'zt-prev-failed';
            prevEl.appendChild(document.createTextNode('Previous run: you ' + action + ' '));
            const span = document.createElement('span');
            span.className   = cls;
            span.textContent = prevEnc.species_name + ' (Lv.' + prevEnc.level + ')';
            prevEl.appendChild(span);
        } else {
            prevEl.textContent = 'No encounter recorded here on your previous run.';
        }

        if (capWarn) {
            capEl.textContent   = '⚠ Encounters here reach Lv.' + capWarn + ' — at or above level cap';
            capEl.style.display = '';
        }
    }

    if (_toastTimer) clearTimeout(_toastTimer);
    toast.classList.add('visible');
    _toastTimer = setTimeout(() => toast.classList.remove('visible'), 8000);
}

let _deathPartyState    = {};
let _deathTimer         = null;
let _seenEncounterKeys  = null;
let _shinyTimer         = null;
let _hadAlive           = true;
let _wipeEndSent        = false;
let _wipeTimer          = null;

function showShinyToast(enc) {
    const toast = document.getElementById('shiny-toast');
    document.getElementById('st-name').textContent =
        enc.species_name + ' Lv.' + enc.level + ' — ' + enc.area;
    if (_shinyTimer) clearTimeout(_shinyTimer);
    toast.classList.add('visible');
    _shinyTimer = setTimeout(() => toast.classList.remove('visible'), 10000);
}

function showWipeToast(party) {
    // Dismiss any active death toast so it doesn't linger behind the wipe banner.
    if (_deathTimer) { clearTimeout(_deathTimer); _deathTimer = null; }
    document.getElementById('death-toast').classList.remove('visible');

    const toast = document.getElementById('wipe-toast');
    document.getElementById('wt-sub').textContent =
        party.map(m => m.nickname).join(', ') + ' all fainted';
    if (_wipeTimer) clearTimeout(_wipeTimer);
    toast.classList.add('visible');
    _wipeTimer = setTimeout(() => toast.classList.remove('visible'), 12000);
}

function showDeathToast(mon) {
    const toast = document.getElementById('death-toast');
    document.getElementById('dt-name').textContent =
        mon.nickname + (mon.nickname !== mon.species_name ? ' (' + mon.species_name + ')' : '');
    document.getElementById('dt-sub').textContent =
        'Lv.' + mon.level + ' — ' + mon.nature + (mon.shiny ? ' ★' : '') +
        (mon.soul_link_kill ? ' · Soul Link' : '');
    if (_deathTimer) clearTimeout(_deathTimer);
    toast.classList.add('visible');
    _deathTimer = setTimeout(() => toast.classList.remove('visible'), 8000);
}

function handleState(slots) {
    const slot = slots[playerIndex];
    if (!slot || !slot.connected || slot.active_run_id == null) return;

    // Death detection
    const next = {};
    for (const mon of (slot.party || [])) {
        if (mon.personality == null) continue;
        next[mon.personality] = mon.dead;
        if (mon.dead && _deathPartyState[mon.personality] === false) showDeathToast(mon);
    }
    _deathPartyState = next;

    // Shiny encounter detection
    const encKeys = new Set((slot.db_encounters || []).map(e => e.map_group + '/' + e.map_name));
    if (_seenEncounterKeys === null) {
        _seenEncounterKeys = encKeys;
    } else {
        for (const enc of (slot.db_encounters || [])) {
            const k = enc.map_group + '/' + enc.map_name;
            if (!_seenEncounterKeys.has(k) && enc.is_shiny) showShinyToast(enc);
        }
        _seenEncounterKeys = encKeys;
    }

    // Wipe / blackout detection
    const party = slot.party || [];
    if (party.length > 0 && slot.active_run_id != null) {
        const allDead = party.every(m => m.dead);
        if (allDead && _hadAlive && !_wipeEndSent) {
            _wipeEndSent = true;
            showWipeToast(party);
            if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ cmd: 'end_run' }));
        }
        if (!allDead) { _hadAlive = true; _wipeEndSent = false; }
        else if (_hadAlive && allDead) _hadAlive = false;
    }
    if (slot.active_run_id == null) _wipeEndSent = false;

    const mg  = slot.current_map_group || 0;
    const mn  = slot.current_map_name  || 0;
    const key = mg + '/' + mn;

    const hasWildEncounters = slot.encounters && slot.encounters.length > 0;
    if (key !== _lastZoneKey && hasWildEncounters) {
        _lastZoneKey = key;

        // Find this run's encounter record for this area (if any).
        const thisRunEnc = (slot.db_encounters || [])
            .find(e => e.map_group === mg && e.map_name === mn) || null;
        const alreadyEncountered = thisRunEnc !== null;

        // Find the previous run's record for cross-run hints.
        const prevEnc = (slot.prev_run_encounters || [])
            .find(e => e.map_group === mg && e.map_name === mn) || null;

        // Level-cap warning — only relevant when no encounter has happened yet.
        let capWarn = null;
        if (!alreadyEncountered && slot.next_gym) {
            const cap     = slot.next_gym.max_level;
            const allMons = (slot.encounters || []).flatMap(g => g.mons);
            if (allMons.some(m => m.max_level >= cap)) capWarn = cap;
        }

        showZoneToast(slot.current_zone_name || key, alreadyEncountered, thisRunEnc, prevEnc, capWarn);
    } else if (!hasWildEncounters) {
        _lastZoneKey = '';
    }
}

let ws;
function connect() {
    ws = new WebSocket('ws://' + location.host + '/ws');
    ws.onmessage = e => handleState(JSON.parse(e.data));
    ws.onclose   = () => setTimeout(connect, 2000);
}
connect();
</script>
</body>
</html>

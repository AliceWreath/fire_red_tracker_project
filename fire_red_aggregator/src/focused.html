<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FireRed Overlay</title>
<!-- THEME_SLOT -->
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    background: transparent;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
}
#root {
    padding: 8px;
    background: rgba(15, 15, 15, 0.88);
    border-radius: 10px;
    display: inline-flex;
    flex-direction: column;
    gap: 4px;
}
.heading {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    font-weight: bold;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    padding-bottom: 5px;
    margin-bottom: 2px;
}
.db-indicator { font-size: 10px; color: #60e060; font-weight: normal; }
.disconnected { color: #e06060; font-size: 14px; padding: 6px 0; }
.badges { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #ddd; }
.badge-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.badge-dot.on  { background: #60e060; }
.badge-dot.off { background: #555; }
.next-gym { font-size: 11px; color: #ffd040; font-weight: 600; }
.gender-m { color: #64a0ff; font-size: 12px; font-weight: bold; }
.gender-f { color: #ff82b4; font-size: 12px; font-weight: bold; }
.soul-link-ann { font-size: 11px; color: #d060d0; font-weight: 600; margin-bottom: 2px; }
.mon { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
.mon.dead { background: rgba(90,0,0,0.45); border-radius: 4px; padding: 4px 5px; }
.mon-inner { display: flex; align-items: flex-start; gap: 6px; }
.mon-sprite { width: 64px; height: 64px; image-rendering: pixelated; flex-shrink: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9)) drop-shadow(0 0 6px rgba(255,255,255,0.35)); }
.mon.dead .mon-sprite { filter: grayscale(100%) brightness(0.5); }
.mon-content { flex: 1; min-width: 0; }
.mon-name-row { display: flex; align-items: center; gap: 5px; font-weight: bold; font-size: 14px; }
.mon.dead .mon-name-row { color: #c06060; }
.dead-badge { color: #ff5050; font-size: 11px; font-weight: bold; }
.lv { color: #ccc; font-size: 11px; font-weight: 600; }
.shiny { font-size: 12px; }
.mon-sub { font-size: 11px; color: #ccc; font-weight: 500; margin-top: 1px; }
.mon-sub-sm { font-size: 10px; color: #bbb; font-weight: 500; margin-top: 1px; }
.hp { font-size: 13px; font-weight: 600; margin-top: 1px; }
.hp-high { color: #fff; }
.hp-mid  { color: #ffe040; }
.hp-low  { color: #ff5050; }
.exp { font-size: 10px; color: #aaa; font-weight: 500; margin-top: 1px; }
.enc-section { margin-top: 4px; }
.enc-heading { font-size: 11px; color: #ccc; font-style: italic; font-weight: 600; margin-bottom: 3px; }
.enc-row { display: flex; flex-wrap: wrap; gap: 4px; }
.enc-mon { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.enc-sprite { width: 52px; height: 52px; image-rendering: pixelated; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9)) drop-shadow(0 0 6px rgba(255,255,255,0.35)); }
.enc-lv { font-size: 9px; color: #bbb; font-weight: 600; text-align: center; }
.record {
    padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex;
    gap: 8px;
    align-items: flex-start;
}
.record-sprite { width: 64px; height: 64px; image-rendering: pixelated; flex-shrink: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9)) drop-shadow(0 0 6px rgba(255,255,255,0.35)); }
.record.dead-record .record-sprite { filter: grayscale(100%) brightness(0.5); }
.record-info { flex: 1; min-width: 0; }
.record-name { font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 5px; }
.record.dead-record .record-name { color: #c06060; }
.section-empty { font-size: 12px; color: #aaa; font-weight: 500; padding: 6px 0; }
.run-controls { display: flex; gap: 4px; margin-left: auto; }
.run-btn {
    font-size: 10px; font-weight: 600; padding: 2px 7px;
    border-radius: 4px; border: none; cursor: pointer;
    color: #fff; text-shadow: none;
}
.run-btn.end { background: #8b2020; }
.run-btn.end:hover { background: #b02828; }
.run-btn.new  { background: #1a6b1a; }
.run-btn.new:hover  { background: #228b22; }
.run-ended-summary {
    margin: 6px 0 2px; padding: 6px 8px;
    background: rgba(60,30,0,0.5); border-radius: 6px;
    font-size: 11px; color: #ddd; line-height: 1.6;
}
.run-ended-summary .summary-title { font-size: 13px; font-weight: bold; color: #e09040; margin-bottom: 3px; }
.db-enc-section { margin-top: 4px; }
.db-enc-heading { font-size: 11px; color: #ccc; font-style: italic; font-weight: 600; margin-bottom: 3px; }
.db-enc-row { display: flex; flex-wrap: wrap; gap: 4px; }
.db-enc-mon { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.db-enc-sprite { width: 52px; height: 52px; image-rendering: pixelated; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9)) drop-shadow(0 0 6px rgba(255,255,255,0.35)); }
.db-enc-sprite.failed { filter: grayscale(80%) brightness(0.6); }
.db-enc-label { font-size: 9px; color: #bbb; font-weight: 600; text-align: center; }
.db-enc-label.caught-yes { color: #60e060; }
.db-enc-label.caught-no  { color: #e06060; }
.box-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
    margin-top: 4px;
}
.box-heading { font-size: 11px; color: #ccc; font-style: italic; font-weight: 600; margin: 6px 0 3px; }
.box-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    padding: 3px 2px;
    border-radius: 4px;
    background: rgba(255,255,255,0.05);
    min-width: 0;
}
.box-slot.shiny { background: rgba(255,215,0,0.1); }
.box-slot.egg   { background: rgba(100,180,100,0.1); }
.box-sprite { width: 52px; height: 52px; image-rendering: pixelated; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9)) drop-shadow(0 0 6px rgba(255,255,255,0.35)); }
.box-name { font-size: 9px; color: #ddd; font-weight: 600; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; }
.box-nature { font-size: 8px; color: #aaa; text-align: center; }
.box-ivs { font-size: 8px; color: #bbb; text-align: center; }
.iv-p     { color: #ffd040; }
.iv-z     { color: #e06060; }
.iv-label { color: rgba(200,200,200,0.45); }
.nat-up   { color: #ff99cc; }
.nat-down { color: #9ec8ff; }
#version-badge {
    position: fixed; top: 4px; right: 6px;
    font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.75);
    background: rgba(0,0,0,0.45); border-radius: 4px; padding: 1px 5px;
    pointer-events: none; z-index: 9999;
}
.lv-cap   { color: #ff6633 !important; font-weight: bold; }
.status-badge {
    display: inline-block; font-size: 9px; font-weight: bold;
    padding: 1px 4px; border-radius: 3px; margin-left: 4px;
    vertical-align: middle; text-shadow: none;
}
.status-slp { background: #555577; color: #ccccee; }
.status-psn { background: #7733aa; color: #ddb8ff; }
.status-brn { background: #aa4400; color: #ffcc99; }
.status-frz { background: #336688; color: #aaddff; }
.status-par { background: #887700; color: #ffee88; }
.status-tox { background: #550077; color: #dd99ff; }
.exp-next { font-size: 10px; color: #888; font-weight: 500; margin-top: 1px; }
/* ── light theme ──────────────────────────────────────────────────────── */
html[data-theme=light],html[data-theme=light] body{color:#111;text-shadow:none}
html[data-theme=light] #root{background:rgba(238,238,238,.93);border:1px solid rgba(0,0,0,.12)}
html[data-theme=light] .heading{border-bottom-color:rgba(0,0,0,.15)}
html[data-theme=light] .mon,html[data-theme=light] .record{border-bottom-color:rgba(0,0,0,.1)}
html[data-theme=light] .badges{color:#444}
html[data-theme=light] .lv,html[data-theme=light] .mon-sub,html[data-theme=light] .mon-sub-sm{color:#444}
html[data-theme=light] .exp,html[data-theme=light] .exp-next,html[data-theme=light] .enc-lv,html[data-theme=light] .enc-heading,html[data-theme=light] .db-enc-heading,html[data-theme=light] .db-enc-label,html[data-theme=light] .section-empty,html[data-theme=light] .box-heading,html[data-theme=light] .box-nature,html[data-theme=light] .box-ivs{color:#555}
html[data-theme=light] .box-name{color:#222}
html[data-theme=light] .disconnected{color:#cc2200}
html[data-theme=light] .db-indicator{color:#007700}
html[data-theme=light] .next-gym{color:#996600}
html[data-theme=light] .soul-link-ann{color:#880088}
html[data-theme=light] .hp-high{color:#111}
html[data-theme=light] .hp-mid{color:#996600}
html[data-theme=light] .hp-low{color:#cc2200}
html[data-theme=light] .run-ended-summary{background:rgba(180,120,0,.12);color:#333}
html[data-theme=light] .run-ended-summary .summary-title{color:#994400}
html[data-theme=light] #version-badge{color:rgba(0,0,0,.6);background:rgba(255,255,255,.8)}

</style>

<body>
<div id="version-badge">v__VERSION__</div>
<div id="root"></div>
<script>
(function(){const t=new URLSearchParams(window.location.search).get('theme');if(t==='light'||t==='minimal'||t==='dark')document.documentElement.dataset.theme=t;}());
// Parse /{playerIndex}/{section} from the URL path
const parts = window.location.pathname.split('/').filter(Boolean);
const playerIndex = parseInt(parts[0]);
const section = parts[1]; // 'party' or 'encounters'

const READONLY = !new URLSearchParams(window.location.search).has('manage');

// --- XP to next level helpers ---
function expForLevel(growthRate, n) {
    if (n <= 1) return 0;
    const n3 = n * n * n;
    switch (growthRate) {
        case 'Fast':        return Math.floor(4 * n3 / 5);
        case 'Medium Fast': return n3;
        case 'Medium Slow': return Math.max(0, Math.floor(6 * n3 / 5) - 15 * n * n + 100 * n - 140);
        case 'Slow':        return Math.floor(5 * n3 / 4);
        case 'Erratic':
            if (n <= 50)      return Math.floor(n3 * (100 - n) / 50);
            if (n <= 68)      return Math.floor(n3 * (150 - n) / 100);
            if (n <= 98)      return Math.floor(n3 * Math.floor((1911 - 10 * n) / 3) / 500);
            return              Math.floor(n3 * (160 - n) / 100);
        case 'Fluctuating':
            if (n <= 15)      return Math.floor(n3 * (Math.floor((n + 1) / 3) + 24) / 50);
            if (n <= 35)      return Math.floor(n3 * (n + 14) / 50);
            return              Math.floor(n3 * (Math.floor(n / 2) + 32) / 50);
        default: return n3;
    }
}

function expToNext(growthRate, level, exp) {
    if (level >= 100) return null;
    return expForLevel(growthRate, level + 1) - exp;
}

let ws;
let reconnectDelay = 1000;
function connect() {
    ws = new WebSocket('ws://' + location.host + '/ws');
    ws.onopen    = () => { reconnectDelay = 1000; };
    ws.onmessage = e => render(JSON.parse(e.data));
    ws.onclose   = () => { setTimeout(connect, reconnectDelay); reconnectDelay = Math.min(reconnectDelay * 2, 30000); };
}
connect();

function sendCmd(cmd) {
    if (!READONLY && ws && ws.readyState === WebSocket.OPEN)
        ws.send(JSON.stringify({ cmd, slot: playerIndex }));
}

function render(slots) {
    const slot = slots[playerIndex];
    const root = document.getElementById('root');
    root.innerHTML = '';

    const hd = el('div', 'heading');
    hd.appendChild(document.createTextNode(slot ? slot.label : 'Player ' + (playerIndex + 1)));
    if (slot && slot.db_connected) {
        const runLabel = slot.active_run_id != null
            ? '● Run #' + slot.active_run_id
            : '● No active run';
        const ind = el('span', 'db-indicator', runLabel);
        if (slot.active_run_id == null) ind.style.color = '#e09040';
        hd.appendChild(ind);
    }

    if (!READONLY) {
        const controls = el('div', 'run-controls');
        const endBtn = el('button', 'run-btn end', 'End Run');
        endBtn.disabled = !slot || slot.active_run_id == null;
        endBtn.onclick = () => {
            if (confirm('End the current run for all connected players?'))
                sendCmd('end_run');
        };
        const newBtn = el('button', 'run-btn new', 'New Run');
        newBtn.onclick = () => {
            if (confirm('Start a new run for all connected players?'))
                sendCmd('new_run');
        };
        controls.appendChild(endBtn);
        controls.appendChild(newBtn);
        hd.appendChild(controls);
    }

    root.appendChild(hd);

    const runEnded = slot && slot.active_run_id == null && slot.run_summary;

    if (!slot || (!slot.connected && !runEnded)) {
        root.appendChild(el('div', 'disconnected', '⚠ Disconnected'));
        return;
    }

    if (section === 'party') {
        if (runEnded) renderRunSummary(root, slot);
        else          renderParty(root, slot);
    } else if (section === 'encounters') {
        if (runEnded) renderDbEncounters(root, slot);
        else          renderEncounters(root, slot);
    } else if (section === 'dead') {
        renderDead(root, slot);
    } else if (section === 'caught') {
        renderCaught(root, slot);
    } else if (section === 'box') {
        renderBox(root, slot);
    }
}

function renderParty(root, slot) {
    const brow = el('div', 'badges');
    brow.appendChild(document.createTextNode('Badges: ' + slot.badges.filter(Boolean).length + '/8  '));
    for (const obtained of slot.badges) {
        brow.appendChild(el('span', 'badge-dot ' + (obtained ? 'on' : 'off')));
    }
    root.appendChild(brow);

    if (slot.next_gym) {
        const g = slot.next_gym;
        root.appendChild(el('div', 'next-gym',
            'Next: ' + g.leader + ' (' + g.city + ') — Lv.' + g.max_level));
    }

    for (const mon of slot.party) {
        const mdiv = el('div', 'mon' + (mon.dead ? ' dead' : ''));

        if (mon.soul_link_partner) {
            const p = mon.soul_link_partner;
            mdiv.appendChild(el('div', 'soul-link-ann',
                'Soul-link: ' + p.nickname + ' (' + p.player + ')'));
        }

        const inner = el('div', 'mon-inner');

        if (mon.sprite) {
            const img = document.createElement('img');
            img.className = 'mon-sprite';
            img.src = mon.sprite;
            inner.appendChild(img);
        }

        const content = el('div', 'mon-content');
        const nr = el('div', 'mon-name-row');
        nr.appendChild(document.createTextNode(mon.nickname));
        const gs = genderSym(mon.gender);
        if (gs.sym) nr.appendChild(el('span', gs.cls, gs.sym));
        if (mon.shiny) nr.appendChild(el('span', 'shiny', '✨'));
        if (mon.dead) {
            nr.appendChild(el('span', 'dead-badge', 'DEAD'));
        } else {
            const atCap = slot.next_gym && mon.level >= slot.next_gym.max_level;
            const lvEl = el('span', atCap ? 'lv lv-cap' : 'lv', 'Lv' + mon.level);
            nr.appendChild(lvEl);
        }
        const sb = statusBadgeEl(mon.status);
        if (sb) nr.appendChild(sb);
        content.appendChild(nr);

        if (mon.dead) {
            content.appendChild(el('div', 'mon-sub',
                'Lv.' + mon.level + ' ' + mon.species_name + ' — ' + mon.nature +
                (mon.shiny ? ' ★' : '')));
            if (mon.soul_link_kill) {
                content.appendChild(el('div', 'mon-sub', 'Soul Link'));
            } else if (mon.attack > 0) {
                content.appendChild(statRowEl('mon-sub-sm', mon.nature, mon.max_hp, mon.attack, mon.defense, mon.speed, mon.sp_attack, mon.sp_defense));
            }
            if (mon.died_at) {
                content.appendChild(el('div', 'mon-sub-sm', 'Died: ' + mon.died_at));
            }
            if (mon.ability) content.appendChild(el('div', 'mon-sub-sm', 'Ability: ' + mon.ability));
            if (mon.held_item && mon.held_item !== 'None') content.appendChild(el('div', 'mon-sub-sm', 'Held: ' + mon.held_item));
            if (mon.growth_rate) content.appendChild(el('div', 'mon-sub-sm', 'Growth: ' + mon.growth_rate));
            if (mon.ev_hp != null) content.appendChild(evRowEl('mon-sub-sm', mon.ev_hp, mon.ev_atk, mon.ev_def, mon.ev_spe, mon.ev_spa, mon.ev_spd));
        } else {
            content.appendChild(el('div', 'mon-sub',
                mon.species_name + ' — ' + mon.nature + (mon.shiny ? ' ★' : '')));
            const ratio = mon.max_hp > 0 ? mon.hp / mon.max_hp : 0;
            const cls   = ratio < 0.3 ? 'hp-low' : ratio < 0.8 ? 'hp-mid' : 'hp-high';
            content.appendChild(el('div', 'hp ' + cls, mon.hp + '/' + mon.max_hp));
            content.appendChild(statRowEl('mon-sub-sm', mon.nature, mon.max_hp, mon.attack, mon.defense, mon.speed, mon.sp_attack, mon.sp_defense));
            content.appendChild(el('div', 'exp', 'Exp: ' + mon.exp));
            const toNext = expToNext(mon.growth_rate, mon.level, mon.exp);
            if (toNext !== null) content.appendChild(el('div', 'exp-next', toNext.toLocaleString() + ' to next level'));
            if (mon.ability) content.appendChild(el('div', 'mon-sub-sm', 'Ability: ' + mon.ability));
            if (mon.held_item && mon.held_item !== 'None') content.appendChild(el('div', 'mon-sub-sm', 'Held: ' + mon.held_item));
            if (mon.growth_rate) content.appendChild(el('div', 'mon-sub-sm', 'Growth: ' + mon.growth_rate));
            if (mon.ev_hp != null) content.appendChild(evRowEl('mon-sub-sm', mon.ev_hp, mon.ev_atk, mon.ev_def, mon.ev_spe, mon.ev_spa, mon.ev_spd));
        }

        inner.appendChild(content);
        mdiv.appendChild(inner);
        root.appendChild(mdiv);
    }
}

function renderEncounters(root, slot) {
    if (!slot.encounters || slot.encounters.length === 0) {
        root.appendChild(el('div', 'mon-sub', 'No encounters in this area'));
        return;
    }
    for (const group of slot.encounters) {
        const sec = el('div', 'enc-section');
        sec.appendChild(el('div', 'enc-heading', group.label));
        const row = el('div', 'enc-row');
        for (const mon of group.mons) {
            const mdiv = el('div', 'enc-mon');
            if (mon.sprite) {
                const img = document.createElement('img');
                img.className = 'enc-sprite';
                img.src = mon.sprite;
                mdiv.appendChild(img);
            }
            row.appendChild(mdiv);
        }
        sec.appendChild(row);
        root.appendChild(sec);
    }
}

function renderDead(root, slot) {
    if (!slot.dead || slot.dead.length === 0) {
        root.appendChild(el('div', 'section-empty', 'No deaths recorded'));
        return;
    }
    for (const mon of slot.dead) {
        const row = el('div', 'record dead-record');

        if (mon.sprite) {
            const img = document.createElement('img');
            img.className = 'record-sprite';
            img.src = mon.sprite;
            row.appendChild(img);
        }

        const info = el('div', 'record-info');

        const nr = el('div', 'record-name');
        nr.appendChild(document.createTextNode(mon.nickname));
        const dgs = genderSym(mon.gender);
        if (dgs.sym) nr.appendChild(el('span', dgs.cls, dgs.sym));
        if (mon.shiny) nr.appendChild(el('span', 'shiny', '✨'));
        nr.appendChild(el('span', 'dead-badge', 'DEAD'));
        info.appendChild(nr);

        info.appendChild(el('div', 'mon-sub',
            'Lv.' + mon.level + ' ' + mon.species_name + ' — ' + mon.nature +
            (mon.shiny ? ' ★' : '')));

        if (mon.soul_link) {
            info.appendChild(el('div', 'mon-sub', 'Soul Link'));
        } else {
            info.appendChild(statRowEl('mon-sub-sm', mon.nature, mon.max_hp, mon.attack, mon.defense, mon.speed, mon.sp_attack, mon.sp_defense));
        }

        info.appendChild(ivRowEl('mon-sub-sm', 'IV:', mon.iv_hp, mon.iv_atk, mon.iv_def, mon.iv_spe, mon.iv_spa, mon.iv_spd, true));

        info.appendChild(el('div', 'mon-sub-sm',
            'EV: ' + mon.ev_hp + '/' + mon.ev_atk + '/' + mon.ev_def +
            '/' + mon.ev_spe + '/' + mon.ev_spa + '/' + mon.ev_spd));

        info.appendChild(el('div', 'mon-sub-sm', 'Died: ' + mon.died_at));

        row.appendChild(info);
        root.appendChild(row);
    }
}

function renderCaught(root, slot) {
    if (!slot.caught || slot.caught.length === 0) {
        root.appendChild(el('div', 'section-empty', 'No pokemon recorded'));
        return;
    }
    for (const mon of slot.caught) {
        const row = el('div', 'record');

        if (mon.sprite) {
            const img = document.createElement('img');
            img.className = 'record-sprite';
            img.src = mon.sprite;
            row.appendChild(img);
        }

        const info = el('div', 'record-info');

        const nr = el('div', 'record-name');
        nr.appendChild(document.createTextNode(mon.nickname));
        const cgs = genderSym(mon.gender);
        if (cgs.sym) nr.appendChild(el('span', cgs.cls, cgs.sym));
        if (mon.shiny) nr.appendChild(el('span', 'shiny', '✨'));
        nr.appendChild(el('span', 'lv', 'Lv' + mon.level));
        info.appendChild(nr);

        info.appendChild(el('div', 'mon-sub',
            mon.species_name + ' — ' + mon.nature + (mon.shiny ? ' ★' : '')));

        info.appendChild(ivRowEl('mon-sub-sm', 'IV:', mon.iv_hp, mon.iv_atk, mon.iv_def, mon.iv_spe, mon.iv_spa, mon.iv_spd, true));

        info.appendChild(el('div', 'mon-sub-sm', 'Caught: ' + mon.caught_at));
        info.appendChild(el('div', 'mon-sub-sm', 'Location: ' + mon.met_location_name));

        row.appendChild(info);
        root.appendChild(row);
    }
}

function renderRunSummary(root, slot) {
    const s = slot.run_summary;
    const summary = el('div', 'run-ended-summary');
    summary.appendChild(el('div', 'summary-title', 'Run #' + s.run_id + ' ended'));
    summary.appendChild(el('div', null, 'Player: ' + s.player_name));
    summary.appendChild(el('div', null, 'Started: ' + s.started_at));
    if (s.ended_at) summary.appendChild(el('div', null, 'Ended: ' + s.ended_at));
    summary.appendChild(el('div', null, 'Caught: ' + s.caught + '  |  Deaths: ' + s.deaths));
    root.appendChild(summary);
}

function renderDbEncounters(root, slot) {
    if (!slot.db_encounters || slot.db_encounters.length === 0) {
        root.appendChild(el('div', 'section-empty', 'No encounters recorded'));
        return;
    }
    const sec = el('div', 'db-enc-section');
    sec.appendChild(el('div', 'db-enc-heading', 'First encounters'));
    const row = el('div', 'db-enc-row');
    for (const enc of slot.db_encounters) {
        const mdiv = el('div', 'db-enc-mon');
        if (enc.sprite) {
            const img = document.createElement('img');
            img.className = 'db-enc-sprite' + (enc.caught ? '' : ' failed');
            img.src = enc.sprite;
            mdiv.appendChild(img);
        }
        mdiv.appendChild(el('div', 'db-enc-label ' + (enc.caught ? 'caught-yes' : 'caught-no'),
            enc.species_name + ' Lv.' + enc.level + (enc.caught ? ' ✓' : ' ✗')));
        mdiv.appendChild(el('div', 'db-enc-label', enc.area));
        row.appendChild(mdiv);
    }
    sec.appendChild(row);
    root.appendChild(sec);
}

function renderBox(root, slot) {
    if (!slot.box_pokemon || slot.box_pokemon.length === 0) {
        root.appendChild(el('div', 'section-empty', 'No Pokemon in boxes'));
        return;
    }

    // Group by box index
    const byBox = {};
    for (const mon of slot.box_pokemon) {
        if (!byBox[mon.box_index]) byBox[mon.box_index] = [];
        byBox[mon.box_index].push(mon);
    }

    for (const boxIdx of Object.keys(byBox).sort((a, b) => a - b)) {
        root.appendChild(el('div', 'box-heading', 'Box ' + (parseInt(boxIdx) + 1)));
        const grid = el('div', 'box-grid');

        for (const mon of byBox[boxIdx]) {
            const cls = 'box-slot' + (mon.is_egg ? ' egg' : mon.is_shiny ? ' shiny' : '');
            const slot = el('div', cls);

            if (mon.sprite) {
                const img = document.createElement('img');
                img.className = 'box-sprite';
                img.src = mon.sprite;
                slot.appendChild(img);
            }

            const gs2   = genderSym(mon.gender);
            const label = mon.is_egg ? 'Egg' : mon.nickname || mon.species_name;
            slot.appendChild(el('div', 'box-name', label + (mon.is_shiny ? ' ✨' : '') + (gs2.sym ? ' ' + gs2.sym : '')));
            if (!mon.is_egg) {
                slot.appendChild(el('div', 'box-nature', mon.nature));
                slot.appendChild(ivRowEl('box-ivs', null, mon.iv_hp, mon.iv_atk, mon.iv_def, mon.iv_spe, mon.iv_spa, mon.iv_spd));
            }

            grid.appendChild(slot);
        }

        root.appendChild(grid);
    }
}

function statusBadgeEl(status) {
    if (!status) return null;
    let label, cls;
    if      (status & 0x07) { label = 'SLP'; cls = 'status-slp'; }
    else if (status & 0x80) { label = 'TOX'; cls = 'status-tox'; }
    else if (status & 0x08) { label = 'PSN'; cls = 'status-psn'; }
    else if (status & 0x10) { label = 'BRN'; cls = 'status-brn'; }
    else if (status & 0x20) { label = 'FRZ'; cls = 'status-frz'; }
    else if (status & 0x40) { label = 'PAR'; cls = 'status-par'; }
    else return null;
    return el('span', 'status-badge ' + cls, label);
}

function genderSym(g) {
    if (g === 0) return { sym: '♂', cls: 'gender-m' };
    if (g === 1) return { sym: '♀', cls: 'gender-f' };
    return { sym: '', cls: '' };
}

function el(tag, cls, txt) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt !== undefined) e.textContent = txt;
    return e;
}

function ivEl(v) {
    const s = document.createElement('span');
    if (v === 31) s.className = 'iv-p';
    else if (v === 0) s.className = 'iv-z';
    s.textContent = v;
    return s;
}

const IV_LABELS = ['HP', 'Atk', 'Def', 'Spe', 'SpA', 'SpD'];

function evRowEl(cls, hp, atk, def, spe, spa, spd) {
    const d = el('div', cls);
    const stats = [['HP', hp], ['Atk', atk], ['Def', def], ['Spe', spe], ['SpA', spa], ['SpD', spd]];
    for (let i = 0; i < stats.length; i++) {
        if (i > 0) d.appendChild(document.createTextNode(' | '));
        const [lbl, val] = stats[i];
        const s = document.createElement('span');
        if (val === 252) s.style.color = '#ffd040';
        s.textContent = lbl + ' ' + val;
        d.appendChild(s);
    }
    return d;
}

function ivRowEl(cls, label, hp, atk, def, spe, spa, spd, labeled) {
    const d = el('div', cls);
    if (label) d.appendChild(document.createTextNode(label + ' '));
    const vals = [hp, atk, def, spe, spa, spd];
    for (let i = 0; i < vals.length; i++) {
        if (i > 0) d.appendChild(document.createTextNode(labeled ? ' ' : '/'));
        if (labeled) {
            const lbl = document.createElement('span');
            lbl.className = 'iv-label';
            lbl.textContent = IV_LABELS[i] + ':';
            d.appendChild(lbl);
        }
        d.appendChild(ivEl(vals[i]));
    }
    return d;
}

const NATURE_MODS = {
    'Lonely':  { up: 'Atk', down: 'Def' }, 'Brave':   { up: 'Atk', down: 'Spe' },
    'Adamant': { up: 'Atk', down: 'SpA' }, 'Naughty': { up: 'Atk', down: 'SpD' },
    'Bold':    { up: 'Def', down: 'Atk' }, 'Relaxed': { up: 'Def', down: 'Spe' },
    'Impish':  { up: 'Def', down: 'SpA' }, 'Lax':     { up: 'Def', down: 'SpD' },
    'Timid':   { up: 'Spe', down: 'Atk' }, 'Hasty':   { up: 'Spe', down: 'Def' },
    'Jolly':   { up: 'Spe', down: 'SpA' }, 'Naive':   { up: 'Spe', down: 'SpD' },
    'Modest':  { up: 'SpA', down: 'Atk' }, 'Mild':    { up: 'SpA', down: 'Def' },
    'Quiet':   { up: 'SpA', down: 'Spe' }, 'Rash':    { up: 'SpA', down: 'SpD' },
    'Calm':    { up: 'SpD', down: 'Atk' }, 'Gentle':  { up: 'SpD', down: 'Def' },
    'Sassy':   { up: 'SpD', down: 'Spe' }, 'Careful': { up: 'SpD', down: 'SpA' },
};

function statRowEl(cls, nature, hp, atk, def, spe, spa, spd) {
    const d = el('div', cls);
    const mods = NATURE_MODS[nature] || {};
    const stats = [['HP', hp], ['Atk', atk], ['Def', def], ['Spe', spe], ['SpA', spa], ['SpD', spd]];
    for (let i = 0; i < stats.length; i++) {
        if (i > 0) d.appendChild(document.createTextNode(' | '));
        const [lbl, val] = stats[i];
        const s = document.createElement('span');
        if (lbl === mods.up) s.className = 'nat-up';
        else if (lbl === mods.down) s.className = 'nat-down';
        s.textContent = lbl + ' ' + val;
        d.appendChild(s);
    }
    return d;
}
</script>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Route Completion</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    background: rgba(15,15,15,0.92);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    padding: 10px;
}
h2 { font-size: 14px; font-weight: bold; color: #ccc; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 4px; }
.region { margin-bottom: 14px; }
.region-title { font-size: 11px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; }
.zone-grid { display: flex; flex-wrap: wrap; gap: 4px; }
.zone-card {
    font-size: 10px; font-weight: 600;
    padding: 4px 8px; border-radius: 5px;
    border: 1px solid transparent;
    white-space: nowrap;
    display: flex; flex-direction: column; gap: 1px;
    min-width: 80px;
}
.zone-unvisited { background: rgba(80,80,80,0.4);  border-color: rgba(120,120,120,0.3); color: #999; }
.zone-caught    { background: rgba(20,80,20,0.55);  border-color: rgba(60,180,60,0.4);  color: #88ee88; }
.zone-failed    { background: rgba(80,15,15,0.55);  border-color: rgba(180,50,50,0.4);  color: #ee8888; }
.zone-species   { font-size: 9px; font-weight: normal; opacity: 0.85; }
.disconnected { font-size: 12px; color: #e06060; padding: 6px 0; }
#header { font-size: 13px; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.run-ind { font-size: 10px; color: #60e060; font-weight: normal; }
.legend { display: flex; gap: 8px; font-size: 10px; margin-bottom: 10px; }
.leg { display: flex; align-items: center; gap: 4px; }
.leg-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.leg-caught  { background: #226622; border: 1px solid #44aa44; }
.leg-failed  { background: #661111; border: 1px solid #aa3333; }
.leg-unvisit { background: #444;    border: 1px solid #666; }
.summary { font-size: 11px; color: #bbb; margin-bottom: 8px; }
.summary span { font-weight: bold; }
.caught-count  { color: #88ee88; }
.failed-count  { color: #ee8888; }
.pending-count { color: #aaaaaa; }
</style>
</head>
<body>
<div id="header">
  <span id="hd-label">Routes</span>
  <span class="run-ind" id="hd-run"></span>
</div>
<div class="legend">
  <div class="leg"><div class="leg-dot leg-caught"></div> Caught</div>
  <div class="leg"><div class="leg-dot leg-failed"></div> Failed / Fled</div>
  <div class="leg"><div class="leg-dot leg-unvisit"></div> Not yet visited</div>
</div>
<div class="summary" id="summary"></div>
<div id="root"></div>
<script src="/static/overlay.js"></script>
<script>
const params      = new URLSearchParams(window.location.search);
const playerIndex = parseInt(
    window.location.pathname.split('/').filter(Boolean)[0] || params.get('slot') || '0'

    { g: 2, m: 0x18, name: 'Lost Cave Room 12' },
    { g: 2, m: 0x19, name: 'Lost Cave Room 13' },
    { g: 2, m: 0x1A, name: 'Lost Cave Room 14' },
    { g: 2, m: 0x1B, name: 'Monean Chamber' },
    { g: 2, m: 0x1C, name: 'Liptoo Chamber' },
    { g: 2, m: 0x1D, name: 'Weepth Chamber' },
    { g: 2, m: 0x1E, name: 'Dilford Chamber' },
    { g: 2, m: 0x1F, name: 'Scufib Chamber' },
    { g: 2, m: 0x20, name: 'Rixy Chamber' },
    { g: 2, m: 0x21, name: 'Viapois Chamber' },
    { g: 2, m: 0x22, name: 'Dunsparce Tunnel' },
];

const REGIONS = [
    { title: 'Kanto Routes',      filter: z => z.g === 3 && z.m <= 0x2C },
    { title: 'Kanto Wild Areas',  filter: z => z.g === 1 && z.m <= 0x4A },
    { title: 'Sevii Islands',     filter: z => (z.g === 3 && z.m > 0x2C) || (z.g === 1 && z.m > 0x4A) || z.g === 2 },
];

function render(slots) {
    const slot = slots[playerIndex];
    const root = document.getElementById('root');
    root.innerHTML = '';

    document.getElementById('hd-label').textContent = slot ? (slot.label || ('Player ' + (playerIndex + 1))) : ('Player ' + (playerIndex + 1));
    const runEl = document.getElementById('hd-run');
    if (slot && slot.db_connected) {
        runEl.textContent = slot.active_run_id != null ? '● Run #' + slot.active_run_id : '● No active run';
        runEl.style.color = slot.active_run_id != null ? '#60e060' : '#e09040';
    } else {
        runEl.textContent = '';
    }

    if (!slot || !slot.connected) {
        root.appendChild(Object.assign(document.createElement('div'), { className: 'disconnected', textContent: '⚠ Disconnected' }));
        return;
    }

    // Build a lookup map from zone key to encounter record
    const encMap = {};
    for (const e of (slot.db_encounters || [])) {
        encMap[e.map_group + '/' + e.map_name] = e;
    }

    let nCaught = 0, nFailed = 0, nPending = 0;
    for (const z of ZONE_LIST) {
        const rec = encMap[z.g + '/' + z.m];
        if (!rec)          nPending++;
        else if (rec.caught) nCaught++;
        else               nFailed++;
    }

    const sumEl = document.getElementById('summary');
    sumEl.innerHTML =
        '<span class="caught-count">' + nCaught  + ' caught</span> · ' +
        '<span class="failed-count">' + nFailed  + ' failed</span> · ' +
        '<span class="pending-count">' + nPending + ' not yet visited</span>';

    for (const region of REGIONS) {
        const zones = ZONE_LIST.filter(region.filter);
        if (!zones.length) continue;

        const sec   = document.createElement('div');
        sec.className = 'region';
        const title = document.createElement('div');
        title.className   = 'region-title';
        title.textContent = region.title;
        sec.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'zone-grid';

        for (const z of zones) {
            const rec = encMap[z.g + '/' + z.m];
            let cls;
            if (!rec)            cls = 'zone-card zone-unvisited';
            else if (rec.caught) cls = 'zone-card zone-caught';
            else                 cls = 'zone-card zone-failed';

            const card = document.createElement('div');
            card.className = cls;
            const nameEl = document.createElement('span');
            nameEl.textContent = z.name;
            card.appendChild(nameEl);
            if (rec) {
                card.title = rec.species_name + ' Lv.' + rec.level + (rec.caught ? ' ✓' : ' ✗') + ' — ' + rec.encountered_at;
                const specEl = document.createElement('span');
                specEl.className = 'zone-species';
                specEl.textContent = rec.species_name + ' Lv.' + rec.level;
                card.appendChild(specEl);
            }
            grid.appendChild(card);
        }

        sec.appendChild(grid);
        root.appendChild(sec);
    }
}

FRT.connectWS(null, render);
</script>
</body>
</html>

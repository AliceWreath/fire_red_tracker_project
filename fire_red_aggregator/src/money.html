<!DOCTYPE html>
<html>
<!-- THEME_SLOT -->
<head>
<meta charset="utf-8">
<title>Money</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    background: transparent;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #fff;
    width: 100%; height: 100%;
    display: flex; align-items: flex-start; justify-content: flex-start;
    overflow: hidden;
}
#root {
    padding: 8px 14px;
    background: rgba(10, 10, 20, 0.88);
    border: 1px solid rgba(80, 120, 200, 0.3);
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.7);
    min-width: 100px;
}
#money-icon { font-size: 16px; line-height: 1; }
#money-value {
    font-size: 18px; font-weight: 800; color: #ffe060; letter-spacing: 0.02em;
}
#disconnected { font-size: 11px; color: #666; }

html[data-theme=light] #root {
    background: rgba(235, 240, 255, 0.93);
    border-color: rgba(60, 100, 200, 0.35);
}
html[data-theme=light] #money-value { color: #b07000; }
</style>
</head>
<body>
<div id="root">
  <div id="money-icon">₱</div>
  <div id="money-value">—</div>
  <div id="disconnected" style="display:none">disconnected</div>
</div>
<script>
const _pathParts  = window.location.pathname.split('/').filter(Boolean);
const _pathIndex  = parseInt(_pathParts[0]);
const _params     = new URLSearchParams(window.location.search);
const playerIndex = !isNaN(_pathIndex) ? _pathIndex : parseInt(_params.get('slot') || '0');

function formatMoney(n) {
    return n.toLocaleString('en-US');
}

function handleState(slots) {
    const slot   = slots[playerIndex];
    const valEl  = document.getElementById('money-value');
    const discEl = document.getElementById('disconnected');

    if (!slot || !slot.connected) {
        discEl.style.display = '';
        valEl.textContent    = '—';
        return;
    }
    discEl.style.display = 'none';
    valEl.textContent    = formatMoney(slot.money || 0);
}

let ws;
let reconnectDelay = 1000;
function connect() {
    ws = new WebSocket('ws://' + location.host + '/ws?show=money');
    ws.onopen    = () => { reconnectDelay = 1000; };
    ws.onmessage = e => handleState(JSON.parse(e.data));
    ws.onclose   = () => { setTimeout(connect, reconnectDelay); reconnectDelay = Math.min(reconnectDelay * 2, 30000); };
}
connect();
</script>
</body>
</html>

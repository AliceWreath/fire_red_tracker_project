<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Run History — FireRed Nuzlocke</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    background: #0f0f0f;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #e0e0e0;
    min-height: 100vh;
}
#root { max-width: 1100px; margin: 0 auto; padding: 16px; }

.page-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 20px;
}
.page-title { font-size: 20px; font-weight: bold; color: #fff; }
.status { font-size: 12px; color: #888; }
.refresh-btn {
    margin-left: auto;
    font-size: 12px; font-weight: 600; padding: 4px 12px;
    background: #1a4a1a; border: 1px solid #2a7a2a; border-radius: 5px;
    color: #80e080; cursor: pointer;
}
.refresh-btn:hover { background: #224a22; }
.empty { text-align: center; color: #555; padding: 40px; font-size: 14px; }
.error { padding: 16px; background: rgba(80,20,20,0.4); border-radius: 6px; color: #e06060; }

/* Run card */
.run-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    margin-bottom: 16px;
    overflow: hidden;
}
.run-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    background: #1a1a2e;
    border-bottom: 1px solid rgba(255,255,255,0.06);
}
.run-header:hover { background: #1e1e38; }
.run-num { font-size: 16px; font-weight: bold; color: #5090e0; min-width: 60px; }
.run-player { font-size: 14px; font-weight: 600; color: #fff; }
.run-active-badge {
    font-size: 10px; font-weight: 700; padding: 2px 7px;
    background: #1a5a1a; border: 1px solid #2a8a2a; border-radius: 10px;
    color: #60e060;
}
.run-dates { font-size: 11px; color: #888; margin-left: auto; text-align: right; }
.run-stats { display: flex; gap: 14px; font-size: 12px; }
.stat { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.stat-val { font-size: 15px; font-weight: bold; }
.stat-val.catches  { color: #60d060; }
.stat-val.deaths   { color: #e06060; }
.stat-val.encs     { color: #d0a040; }
.stat-lbl { font-size: 9px; color: #777; text-transform: uppercase; letter-spacing: 0.5px; }
.chevron { color: #888; font-size: 12px; transition: transform 0.2s; }
.chevron.open { transform: rotate(90deg); }

/* Run body */
.run-body { display: none; padding: 12px 16px; }
.run-body.open { display: block; }

/* Section within a run */
.section { margin-bottom: 12px; }
.section-title {
    font-size: 11px; font-weight: 700; color: #aaa;
    text-transform: uppercase; letter-spacing: 0.6px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding-bottom: 5px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none;
}
.section-title .count { color: #777; font-weight: 500; }
.section-title .chevron { font-size: 10px; }
.section-body { display: none; }
.section-body.open { display: block; }
.section-empty { font-size: 12px; color: #555; padding: 6px 0; }

/* Record rows */
.records { display: flex; flex-direction: column; gap: 5px; }
.record {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    padding: 5px 8px; border-radius: 4px;
    background: rgba(255,255,255,0.02);
    border-left: 3px solid transparent;
    font-size: 12px;
}
.record.caught-rec  { border-left-color: #2a6a2a; }
.record.dead-rec    { border-left-color: #6a1a1a; }
.record.enc-rec     { border-left-color: #5a4a10; }
.record.enc-caught  { border-left-color: #2a6a2a; }
.record.enc-fled    { border-left-color: #6a1a1a; }
.r-name  { font-weight: 600; color: #fff; min-width: 90px; }
.r-spec  { color: #bbb; }
.r-lv    { color: #888; font-size: 11px; }
.r-nat   { color: #aaa; font-size: 11px; }
.r-shiny { color: #ffd040; font-size: 11px; }
.r-loc   { color: #7090cc; font-size: 11px; }
.r-ivs   { font-family: monospace; color: #777; font-size: 10px; }
.iv-p    { color: #ffd040; }
.iv-z    { color: #e06060; }
.iv-lbl  { color: rgba(200,200,200,0.45); }
.nat-up  { color: #ff99cc; }
.nat-dn  { color: #9ec8ff; }
.r-time  { color: #555; font-size: 10px; margin-left: auto; white-space: nowrap; }
.r-dead  { color: #e06060; font-size: 11px; font-weight: 600; }
.r-soul  { color: #d060d0; font-size: 10px; }
.r-stats { font-family: monospace; color: #777; font-size: 10px; }
.r-area  { color: #7090cc; font-size: 11px; }
.r-out-caught { color: #60d060; font-size: 11px; font-weight: 600; }
.r-out-fled   { color: #808080; font-size: 11px; }
.r-gm { color: #64a0ff; font-size: 11px; font-weight: bold; }
.r-gf { color: #ff82b4; font-size: 11px; font-weight: bold; }
.player-section { margin-bottom: 10px; }
.player-heading {
    font-size: 12px; font-weight: 700; color: #9eb8e0;
    padding: 5px 0 4px; margin-bottom: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; gap: 6px;
    cursor: pointer; user-select: none;
}
.player-body.closed { display: none; }
</style>
</head>
<body>
<div id="root">
    <div class="page-header">
        <div class="page-title" id="page-title">Run History</div>
        <div class="status" id="status">Loading...</div>
        <a id="all-runs-link" href="/history" style="display:none;font-size:12px;color:#7090cc;text-decoration:none;margin-right:4px">← All Runs</a>
        <button class="refresh-btn" onclick="loadData()">↺ Refresh</button>
    </div>
    <div id="runs"></div>
</div>
<script>
function gSym(g) {
    if (g === 0) return '♂';
    if (g === 1) return '♀';
    return '';
}

function getRunFilter() {
    return parseInt(new URLSearchParams(location.search).get('run') || '0') || null;
}

async function loadData() {
    document.getElementById('status').textContent = 'Loading...';
    const runFilter = getRunFilter();
    if (runFilter) {
        document.getElementById('page-title').textContent = 'Run #' + runFilter + ' History';
        document.getElementById('all-runs-link').style.display = '';
    }
    try {
        const res  = await fetch('/db.json');
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        document.getElementById('status').textContent =
            'Last fetched: ' + new Date().toLocaleTimeString();
        render(data, runFilter);
    } catch (e) {
        document.getElementById('status').textContent = 'Error';
        document.getElementById('runs').innerHTML =
            '<div class="error">Failed to load: ' + e.message + '</div>';
    }
}

function render(data, runFilter) {
    const container = document.getElementById('runs');
    if (!data.runs || data.runs.length === 0) {
        container.innerHTML = '<div class="empty">No runs recorded yet.</div>';
        return;
    }

    // Group caught/dead/encounters by run_id
    const byRun = {};
    for (const r of data.runs) {
        byRun[r.id] = { run: r, caught: [], dead: [], encounters: [] };
    }
    for (const c of (data.caught     || [])) if (byRun[c.run_id]) byRun[c.run_id].caught.push(c);
    for (const d of (data.dead       || [])) if (byRun[d.run_id]) byRun[d.run_id].dead.push(d);
    for (const e of (data.encounters || [])) if (byRun[e.run_id]) byRun[e.run_id].encounters.push(e);

    container.innerHTML = '';

    // Newest run first; filter to a single run if ?run= is set
    let sorted = Object.values(byRun).sort((a, b) => b.run.id - a.run.id);
    if (runFilter) {
        sorted = sorted.filter(x => x.run.id === runFilter);
        if (sorted.length === 0) {
            container.innerHTML = '<div class="empty">Run #' + runFilter + ' not found.</div>';
            return;
        }
    }

    const autoExpand = runFilter != null || sorted.length === 1;

    for (const { run, caught, dead, encounters } of sorted) {
        const active = run.ended == null;
        const card   = document.createElement('div');
        card.className = 'run-card';

        // ── Header ──────────────────────────────────────────────────────
        const hdr = document.createElement('div');
        hdr.className = 'run-header';

        const num = el('div', 'run-num', 'Run #' + run.id);
        const player = el('div', 'run-player', run.player);
        hdr.appendChild(num);
        hdr.appendChild(player);
        if (active) hdr.appendChild(el('span', 'run-active-badge', 'Active'));

        const dates = document.createElement('div');
        dates.className = 'run-dates';
        dates.innerHTML = 'Started: ' + run.started +
            '<br>' + (run.ended ? 'Ended: ' + run.ended : '— ongoing —');
        hdr.appendChild(dates);

        const stats = document.createElement('div');
        stats.className = 'run-stats';
        stats.appendChild(statEl(run.catches,    'Caught',     'catches'));
        stats.appendChild(statEl(run.deaths,     'Deaths',     'deaths'));
        stats.appendChild(statEl(run.encounters, 'Encounters', 'encs'));
        hdr.appendChild(stats);

        const chev = el('span', 'chevron', '▶');
        hdr.appendChild(chev);

        // ── Body ─────────────────────────────────────────────────────────
        const body = document.createElement('div');
        body.className = 'run-body';

        const players = [...new Set([
            ...caught.map(c => c.player),
            ...dead.map(d => d.player),
            ...encounters.map(e => e.player),
        ])].filter(Boolean).sort();

        if (players.length === 0) {
            body.appendChild(buildCaughtSection(caught));
            body.appendChild(buildDeadSection(dead));
            body.appendChild(buildEncountersSection(encounters));
        } else {
            // Records written before player-name tracking was fixed have an
            // empty player field.  Assign them to the first player so they are
            // at least visible (the DB migration will fix this permanently on
            // next tracker restart).
            const unassignedCaught = caught.filter(c => !c.player);
            const unassignedDead   = dead.filter(d => !d.player);

            for (let pi = 0; pi < players.length; pi++) {
                const player = players[pi];
                const isFirst = pi === 0;
                body.appendChild(buildPlayerSection(
                    player,
                    caught.filter(c => c.player === player).concat(isFirst ? unassignedCaught : []),
                    dead.filter(d => d.player === player).concat(isFirst ? unassignedDead : []),
                    encounters.filter(e => e.player === player),
                ));
            }
        }

        hdr.onclick = () => {
            const open = body.classList.toggle('open');
            chev.classList.toggle('open', open);
        };

        card.appendChild(hdr);
        card.appendChild(body);
        container.appendChild(card);

        if (autoExpand) {
            body.classList.add('open');
            chev.classList.add('open');
        }
    }
}

function statEl(val, label, cls) {
    const s = document.createElement('div');
    s.className = 'stat';
    s.appendChild(el('div', 'stat-val ' + cls, String(val)));
    s.appendChild(el('div', 'stat-lbl', label));
    return s;
}

function buildPlayerSection(player, caught, dead, encounters) {
    const div = document.createElement('div');
    div.className = 'player-section';

    const hdr = document.createElement('div');
    hdr.className = 'player-heading';
    hdr.appendChild(document.createTextNode(player));
    const chev = el('span', 'chevron', '▶');
    hdr.appendChild(chev);

    const body = document.createElement('div');
    body.className = 'player-body';
    body.appendChild(buildCaughtSection(caught));
    body.appendChild(buildDeadSection(dead));
    body.appendChild(buildEncountersSection(encounters));

    hdr.onclick = () => {
        const closed = body.classList.toggle('closed');
        chev.style.transform = closed ? '' : 'rotate(90deg)';
    };
    chev.style.transform = 'rotate(90deg)';

    div.appendChild(hdr);
    div.appendChild(body);
    return div;
}

function buildCaughtSection(caught) {
    const sorted = [...caught].sort((a, b) => a.caught_at.localeCompare(b.caught_at));
    return buildSection('Caught', sorted.length, sorted, row => {
        const r = document.createElement('div');
        r.className = 'record caught-rec';
        r.appendChild(el('span', 'r-name', row.nickname || row.species));
        r.appendChild(el('span', 'r-spec', row.nickname ? row.species : ''));
        const cg = gSym(row.gender);
        if (cg) r.appendChild(el('span', cg === '♂' ? 'r-gm' : 'r-gf', cg));
        r.appendChild(el('span', 'r-lv',   'Lv' + row.level));
        r.appendChild(el('span', 'r-nat',  row.nature));
        if (row.shiny) r.appendChild(el('span', 'r-shiny', '★'));
        r.appendChild(el('span', 'r-loc',  row.location || '—'));
        r.appendChild(ivSpan(row.ivs));
        r.appendChild(el('span', 'r-time', row.caught_at));
        return r;
    });
}

function buildDeadSection(dead) {
    const sorted = [...dead].sort((a, b) => a.died_at.localeCompare(b.died_at));
    return buildSection('Deaths', sorted.length, sorted, row => {
        const r = document.createElement('div');
        r.className = 'record dead-rec';
        r.appendChild(el('span', 'r-name', row.nickname || row.species));
        r.appendChild(el('span', 'r-spec', row.nickname ? row.species : ''));
        const dg = gSym(row.gender);
        if (dg) r.appendChild(el('span', dg === '♂' ? 'r-gm' : 'r-gf', dg));
        r.appendChild(el('span', 'r-lv',   'Lv' + row.level));
        r.appendChild(el('span', 'r-nat',  row.nature));
        if (row.shiny)     r.appendChild(el('span', 'r-shiny', '★'));
        if (row.soul_link) r.appendChild(el('span', 'r-soul',  'soul link'));
        else               r.appendChild(statsSpan(row.stats, row.nature));
        r.appendChild(ivSpan(row.ivs));
        r.appendChild(el('span', 'r-time', row.died_at));
        return r;
    });
}

function buildEncountersSection(encounters) {
    const sorted = [...encounters].sort((a, b) => a.seen_at.localeCompare(b.seen_at));
    return buildSection('First Encounters', sorted.length, sorted, row => {
        const r = document.createElement('div');
        r.className = 'record enc-rec ' + (row.caught ? 'enc-caught' : 'enc-fled');
        r.appendChild(el('span', 'r-area',  row.area));
        r.appendChild(el('span', 'r-spec',  row.species));
        r.appendChild(el('span', 'r-lv',    'Lv' + row.level));
        r.appendChild(el('span', row.caught ? 'r-out-caught' : 'r-out-fled',
                         row.caught ? 'caught' : 'fled'));
        r.appendChild(el('span', 'r-time', row.seen_at));
        return r;
    });
}

function buildSection(title, count, rows, buildRow) {
    const sec   = document.createElement('div');
    sec.className = 'section';

    const hdr   = document.createElement('div');
    hdr.className = 'section-title';
    hdr.innerHTML = title + ' <span class="count">(' + count + ')</span>'
                  + ' <span class="chevron">▶</span>';

    const body  = document.createElement('div');
    body.className = 'section-body open';

    if (rows.length === 0) {
        body.appendChild(el('div', 'section-empty', 'None recorded'));
    } else {
        const list = document.createElement('div');
        list.className = 'records';
        for (const row of rows) list.appendChild(buildRow(row));
        body.appendChild(list);
    }

    hdr.onclick = () => {
        const open = body.classList.toggle('open');
        hdr.querySelector('.chevron').style.transform = open ? 'rotate(90deg)' : '';
    };
    // Start expanded
    hdr.querySelector('.chevron').style.transform = 'rotate(90deg)';

    sec.appendChild(hdr);
    sec.appendChild(body);
    return sec;
}

function el(tag, cls, txt) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt !== undefined) e.textContent = txt;
    return e;
}

const IV_STAT_LABELS = ['HP', 'Atk', 'Def', 'Spe', 'SpA', 'SpD'];

function ivSpan(str) {
    const wrap = document.createElement('span');
    wrap.className = 'r-ivs';
    if (!str) return wrap;
    const parts = String(str).split('/');
    for (let i = 0; i < parts.length; i++) {
        if (i > 0) wrap.appendChild(document.createTextNode(' '));
        const lbl = document.createElement('span');
        lbl.className = 'iv-lbl';
        lbl.textContent = (IV_STAT_LABELS[i] || '?') + ':';
        wrap.appendChild(lbl);
        const v = parseInt(parts[i], 10);
        const s = document.createElement('span');
        if (v === 31) s.className = 'iv-p';
        else if (v === 0) s.className = 'iv-z';
        s.textContent = parts[i];
        wrap.appendChild(s);
    }
    return wrap;
}

const NATURE_MODS_H = {
    'Lonely':  { up: 'Atk', down: 'Def' }, 'Brave':   { up: 'Atk', down: 'Spe' },
    'Adamant': { up: 'Atk', down: 'SpA' }, 'Naughty': { up: 'Atk', down: 'SpD' },
    'Bold':    { up: 'Def', down: 'Atk' }, 'Relaxed': { up: 'Def', down: 'Spe' },
    'Impish':  { up: 'Def', down: 'SpA' }, 'Lax':     { up: 'Def', down: 'SpD' },
    'Timid':   { up: 'Spe', down: 'Atk' }, 'Hasty':   { up: 'Spe', down: 'Def' },
    'Jolly':   { up: 'Spe', down: 'SpA' }, 'Naive':   { up: 'Spe', down: 'SpD' },
    'Modest':  { up: 'SpA', down: 'Atk' }, 'Mild':    { up: 'SpA', down: 'Def' },
    'Quiet':   { up: 'SpA', down: 'Spe' }, 'Rash':    { up: 'SpA', down: 'SpD' },
    'Calm':    { up: 'SpD', down: 'Atk' }, 'Gentle':  { up: 'SpD', down: 'Def' },
    'Sassy':   { up: 'SpD', down: 'Spe' }, 'Careful': { up: 'SpD', down: 'SpA' },
};

function statsSpan(str, nature) {
    const wrap = document.createElement('span');
    wrap.className = 'r-stats';
    if (!str) return wrap;
    const mods  = NATURE_MODS_H[nature] || {};
    const parts = String(str).split('/');
    const labels = IV_STAT_LABELS;
    for (let i = 0; i < parts.length; i++) {
        if (i > 0) wrap.appendChild(document.createTextNode(' | '));
        const lbl = labels[i] || '?';
        const s = document.createElement('span');
        if (lbl === mods.up)   s.className = 'nat-up';
        else if (lbl === mods.down) s.className = 'nat-dn';
        s.textContent = lbl + ' ' + parts[i];
        wrap.appendChild(s);
    }
    return wrap;
}

loadData();
</script>
</body>
</html>

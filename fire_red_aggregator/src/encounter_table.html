<!DOCTYPE html>
<html>
<!-- THEME_SLOT -->
<head>
<meta charset="utf-8">
<title>Encounter Table</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    background: transparent;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #fff;
    width: 100%; height: 100%;
    display: flex; align-items: flex-start; justify-content: flex-start;
    overflow: hidden;
}
#root {
    padding: 8px 12px;
    background: rgba(10, 10, 20, 0.88);
    border: 1px solid rgba(80, 120, 200, 0.3);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 180px;
    max-width: 280px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.7);
}
#area-name {
    font-size: 11px; font-weight: 700; color: #aac; letter-spacing: 0.04em;
    text-transform: uppercase;
}
.group-label {
    font-size: 10px; color: #778; font-weight: 600; margin-top: 2px;
    text-transform: uppercase; letter-spacing: 0.05em;
}
.rate-tag {
    font-size: 9px; color: #fa8; font-weight: 600; margin-left: 4px;
}
.mon-row {
    display: flex; align-items: center; gap: 5px;
    padding: 1px 0;
}
.mon-sprite {
    width: 28px; height: 28px; image-rendering: pixelated; flex-shrink: 0;
}
.mon-info { flex: 1; min-width: 0; }
.mon-name {
    font-size: 10px; font-weight: 700; color: #dde;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mon-levels { font-size: 9px; color: #889; }
#disconnected { font-size: 11px; color: #666; text-align: center; padding: 4px; }

html[data-theme=light] #root {
    background: rgba(235, 240, 255, 0.93);
    border-color: rgba(60, 100, 200, 0.35);
    color: #111;
}
html[data-theme=light] #area-name { color: #334; }
html[data-theme=light] .group-label { color: #667; }
html[data-theme=light] .mon-name { color: #222; }
html[data-theme=light] .mon-levels { color: #667; }
</style>
</head>
<body>
<div id="root">
  <div id="area-name"></div>
  <div id="groups"></div>
  <div id="disconnected">disconnected</div>
</div>
<script src="/static/overlay.js"></script>
<script>
const _pathParts  = window.location.pathname.split('/').filter(Boolean);
const _pathIndex  = parseInt(_pathParts[0]);
const _params     = new URLSearchParams(window.location.search);
const _explicitIndex = !isNaN(_pathIndex) ? _pathIndex
    : (_params.has('slot') ? parseInt(_params.get('slot')) : null);
let playerIndex = _explicitIndex !== null ? _explicitIndex : 0;
function resolvePlayerIndex(slots) {
    if (_explicitIndex !== null) return;
    const first = slots.findIndex(s => s && s.connected);
    if (first !== -1) playerIndex = first;
}

function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls)  e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
}

function handleState(slots) {
    resolvePlayerIndex(slots);
    const slot    = slots[playerIndex];
    const areaEl  = document.getElementById('area-name');
    const groupsEl= document.getElementById('groups');
    const discEl  = document.getElementById('disconnected');

    groupsEl.innerHTML = '';

    if (!slot || !slot.connected) {
        discEl.style.display = '';
        areaEl.textContent   = '';
        return;
    }
    discEl.style.display = 'none';
    areaEl.textContent   = slot.current_zone_name || '';

    for (const group of (slot.encounters || [])) {
        const lbl = el('div', 'group-label');
        lbl.innerHTML = group.label + (group.encounter_rate ? '<span class="rate-tag">' + group.encounter_rate + '%</span>' : '');
        groupsEl.appendChild(lbl);

        for (const mon of (group.mons || [])) {
            const row = el('div', 'mon-row');
            if (mon.sprite) {
                const img = document.createElement('img');
                img.className = 'mon-sprite';
                img.src = mon.sprite;
                row.appendChild(img);
            } else {
                row.appendChild(el('div', 'mon-sprite'));
            }
            const info = el('div', 'mon-info');
            info.appendChild(el('div', 'mon-name', mon.species_name));
            const lvl = mon.min_level === mon.max_level
                ? 'Lv. ' + mon.min_level
                : 'Lv. ' + mon.min_level + '–' + mon.max_level;
            info.appendChild(el('div', 'mon-levels', lvl));
            row.appendChild(info);
            groupsEl.appendChild(row);
        }
    }

    if (!(slot.encounters || []).length) {
        groupsEl.appendChild(el('div', 'group-label', 'No encounters here'));
    }
}

FRT.connectWS('encounter_table', handleState);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<!-- THEME_SLOT -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bag Items — v__VERSION__</title>
<style>
:root {
  --bg: #1a1a1a;
  --bg2: #242424;
  --bg3: #2e2e2e;
  --border: #444;
  --text: #e8e8e8;
  --text2: #aaa;
  --accent: #5b8dd9;
  --tab-active: #5b8dd9;
  --tab-hover: #3a3a3a;
  --empty: #666;
  --qty: #a0d080;
  --keyitem: #e8c060;
  --ball: #e07050;
  --tm: #80b8e8;
}
[data-theme="light"] {
  --bg: #f5f5f5;
  --bg2: #fff;
  --bg3: #e8e8e8;
  --border: #ccc;
  --text: #111;
  --text2: #555;
  --accent: #2a60c0;
  --tab-active: #2a60c0;
  --tab-hover: #e0e0e0;
  --empty: #999;
  --qty: #2a7020;
  --keyitem: #9a6010;
  --ball: #a03020;
  --tm: #1050a0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', sans-serif;
  font-size: 14px;
  min-height: 100vh;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
}
header h1 { font-size: 16px; font-weight: 600; }
header .meta { font-size: 12px; color: var(--text2); }
.tabs {
  display: flex;
  gap: 2px;
  padding: 8px 16px 0;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
}
.tab {
  padding: 7px 18px;
  border: 1px solid var(--border);
  border-bottom: none;
  border-radius: 4px 4px 0 0;
  background: var(--bg3);
  color: var(--text2);
  cursor: pointer;
  font-size: 13px;
  user-select: none;
  transition: background 0.1s;
}
.tab:hover { background: var(--tab-hover); color: var(--text); }
.tab.active {
  background: var(--bg);
  color: var(--tab-active);
  border-bottom: 1px solid var(--bg);
  font-weight: 600;
  margin-bottom: -1px;
}
.panel { display: none; padding: 16px; }
.panel.active { display: block; }
.item-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 8px;
}
.item-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.item-name { font-weight: 500; }
.item-id { font-size: 11px; color: var(--text2); margin-top: 1px; }
.item-qty {
  font-size: 16px;
  font-weight: 700;
  color: var(--qty);
  min-width: 36px;
  text-align: right;
}
.pocket-items .item-qty { color: var(--qty); }
.pocket-key .item-qty { color: var(--keyitem); }
.pocket-balls .item-qty { color: var(--ball); }
.pocket-tms .item-qty { color: var(--tm); }
.empty-msg {
  color: var(--empty);
  font-style: italic;
  padding: 20px 0;
}
.badge {
  display: inline-block;
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 10px;
  background: var(--bg3);
  color: var(--text2);
  margin-left: 6px;
  vertical-align: middle;
}
.error { color: #e06060; padding: 20px 0; }
</style>
</head>
<body>
<header>
  <h1>Bag Items</h1>
  <div class="meta" id="meta">Loading...</div>
</header>
<div class="tabs">
  <div class="tab active" data-tab="items">Items <span class="badge" id="cnt-items">0</span></div>
  <div class="tab" data-tab="key_items">Key Items <span class="badge" id="cnt-key">0</span></div>
  <div class="tab" data-tab="balls">Balls <span class="badge" id="cnt-balls">0</span></div>
  <div class="tab" data-tab="tms">TMs/HMs <span class="badge" id="cnt-tms">0</span></div>
</div>
<div id="panel-items"    class="panel pocket-items active"></div>
<div id="panel-key_items" class="panel pocket-key"></div>
<div id="panel-balls"    class="panel pocket-balls"></div>
<div id="panel-tms"      class="panel pocket-tms"></div>

function itemName(id) {
  return ITEM_NAMES[id] || ("Item #" + id);
}

// ---------------------------------------------------------------------------
// Tab switching
// ---------------------------------------------------------------------------
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    const key = tab.dataset.tab;
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("panel-" + key).classList.add("active");
  });
});

// ---------------------------------------------------------------------------
// Fetch and render
// ---------------------------------------------------------------------------
const indexMatch = window.location.pathname.match(/^\/(\d+)\//);
const slotIndex  = indexMatch ? indexMatch[1] : "0";

function renderPocket(panelId, slots, emptyMsg) {
  const el = document.getElementById(panelId);
  if (!slots || slots.length === 0) {
    el.innerHTML = '<p class="empty-msg">' + emptyMsg + '</p>';
    return 0;
  }
  const cards = slots.map(s => {
    const name = escHtml(itemName(s.item_id));
    return `<div class="item-card">
      <div>
        <div class="item-name">${name}</div>
        <div class="item-id">ID #${s.item_id}</div>
      </div>
      <div class="item-qty">×${s.quantity}</div>
    </div>`;
  }).join("");
  el.innerHTML = '<div class="item-grid">' + cards + '</div>';
  return slots.length;
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

async function refresh() {
  try {
    const r = await fetch(`/api/slot/${slotIndex}/bag`);
    const data = await r.json();
    if (data.error) {
      document.getElementById("meta").textContent = data.error;
      return;
    }
    const ci = renderPocket("panel-items",     data.items,     "Items pocket is empty.");
    const ck = renderPocket("panel-key_items", data.key_items, "Key items pocket is empty.");
    const cb = renderPocket("panel-balls",     data.balls,     "Balls pocket is empty.");
    const ct = renderPocket("panel-tms",       data.tms,       "TMs/HMs pocket is empty.");
    document.getElementById("cnt-items").textContent = ci;
    document.getElementById("cnt-key").textContent   = ck;
    document.getElementById("cnt-balls").textContent = cb;
    document.getElementById("cnt-tms").textContent   = ct;
    document.getElementById("meta").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById("meta").textContent = "Error: " + e.message;
  }
}

refresh();
setInterval(refresh, 3000);

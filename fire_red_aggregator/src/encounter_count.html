<!DOCTYPE html>
<html>
<!-- THEME_SLOT -->
<head>
<meta charset="utf-8">
<title>Encounter Counter</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    background: transparent;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #fff;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
}
#panel {
    background: rgba(5, 15, 30, 0.88);
    border: 1px solid rgba(80, 140, 255, 0.35);
    border-radius: 10px;
    padding: 14px 28px;
    text-align: center;
    min-width: 150px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.7);
}
#label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #6699ee;
    margin-bottom: 6px;
}
#count {
    font-size: 56px;
    font-weight: 900;
    color: #88bbff;
    line-height: 1;
    text-shadow: 0 0 16px rgba(80, 140, 255, 0.5);
}
#sub {
    font-size: 12px;
    color: #7799cc;
    margin-top: 6px;
}
#remaining {
    font-size: 12px;
    color: #99bb77;
    margin-top: 3px;
    font-weight: 600;
}
#player { font-size: 11px; color: #555; margin-top: 4px; }
#disconnected { display: none; font-size: 11px; color: #666; margin-top: 4px; }
html[data-theme=light] #panel {
    background: rgba(235, 245, 255, 0.92);
    border-color: rgba(60, 100, 200, 0.4);
    color: #111;
}
html[data-theme=light] #label { color: #2244aa; }
html[data-theme=light] #count { color: #2255cc; text-shadow: none; }
html[data-theme=light] #sub { color: #446699; }
html[data-theme=light] #remaining { color: #336622; }
html[data-theme=light] #player { color: #555; }
</style>
</head>
<body>
<div id="panel">
  <div id="label">Encounters</div>
  <div id="count">–</div>
  <div id="sub"></div>
  <div id="remaining"></div>
  <div id="player"></div>
  <div id="disconnected">disconnected</div>
</div>
<script>
const _pathParts  = window.location.pathname.split('/').filter(Boolean);
const _pathIndex  = parseInt(_pathParts[0]);
const _params     = new URLSearchParams(window.location.search);
const _explicitIndex = !isNaN(_pathIndex) ? _pathIndex
    : (_params.has('slot') ? parseInt(_params.get('slot')) : null);
let playerIndex = _explicitIndex !== null ? _explicitIndex : 0;
function resolvePlayerIndex(slots) {
    if (_explicitIndex !== null) return;
    const first = slots.findIndex(s => s && s.connected);
    if (first !== -1) playerIndex = first;
}

function handleState(slots) {
    resolvePlayerIndex(slots);
    const slot = slots[playerIndex];
    const countEl     = document.getElementById('count');
    const subEl       = document.getElementById('sub');
    const remEl       = document.getElementById('remaining');
    const playerEl    = document.getElementById('player');
    const discEl      = document.getElementById('disconnected');
    if (!slot || !slot.connected) {
        discEl.style.display = '';
        return;
    }
    discEl.style.display = 'none';
    const encs   = slot.db_encounters || [];
    const total  = encs.length;
    const caught = encs.filter(e => e.caught).length;
    const missed = encs.filter(e => !e.caught).length;
    countEl.textContent = total;
    subEl.textContent   = caught + ' caught' + (missed > 0 ? ' · ' + missed + ' missed' : '');
    remEl.textContent   = '';  // uncaught zones count not directly available here
    playerEl.textContent = slot.label || '';
}

let ws;
let reconnectDelay = 1000;
function connect() {
    ws = new WebSocket('ws://' + location.host + '/ws?show=counter' + (_params.get('token') ? '&token=' + encodeURIComponent(_params.get('token')) : ''));
    ws.onopen    = () => { reconnectDelay = 1000; };
    ws.onmessage = e => handleState(JSON.parse(e.data));
    ws.onclose   = () => { setTimeout(connect, reconnectDelay); reconnectDelay = Math.min(reconnectDelay * 2, 30000); };
}
connect();
</script>
</body>
</html>

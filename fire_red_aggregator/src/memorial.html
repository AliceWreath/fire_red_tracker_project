<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Memorial — FireRed Nuzlocke</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    background: #0f0f0f;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #e0e0e0;
    min-height: 100vh;
}
#root { max-width: 1100px; margin: 0 auto; padding: 16px; }
.page-header {
    display: flex; align-items: center; gap: 12px;
    padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 24px;
}
.page-title { font-size: 20px; font-weight: bold; color: #fff; }
.player-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.tab-btn {
    padding: 5px 14px; font-size: 12px; font-weight: 600;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; color: #bbb; cursor: pointer;
}
.tab-btn.active { background: #1a3a5a; border-color: #4080c0; color: #80c0ff; }
.run-selector { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.run-selector select {
    background: #1a1a2e; border: 1px solid rgba(255,255,255,0.15);
    color: #e0e0e0; border-radius: 5px; padding: 4px 8px; font-size: 13px;
}
.back-link { font-size: 12px; color: #5090e0; text-decoration: none; margin-left: auto; }
.back-link:hover { text-decoration: underline; }
.empty { text-align: center; color: #555; padding: 40px; font-size: 14px; }
.loading { color: #888; font-size: 13px; padding: 20px; }
.waiting  { color: #666; font-size: 13px; padding: 20px; text-align: center; }

/* Memorial grid */
.memorial-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
}
.mon-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 10px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    text-align: center;
    transition: border-color 0.2s;
}
.mon-card:hover { border-color: rgba(255,255,255,0.2); }
.mon-card.shiny { border-color: rgba(255,215,0,0.3); background: rgba(255,215,0,0.05); }
.mon-card.soul-link { border-color: rgba(150,60,150,0.4); background: rgba(80,20,80,0.15); }
.mon-sprite { width: 56px; height: 56px; image-rendering: pixelated; filter: grayscale(60%) brightness(0.7); }
.mon-sprite.shiny-sprite { filter: none; }
.mon-name { font-size: 12px; font-weight: 700; color: #e0e0e0; word-break: break-word; }
.mon-species { font-size: 10px; color: #888; }
.mon-level  { font-size: 10px; color: #777; }
.mon-loc    { font-size: 9px; color: #666; margin-top: 1px; word-break: break-word; }
.mon-date   { font-size: 9px; color: #555; }
.shiny-star { font-size: 10px; color: #ffd700; }
.sl-icon    { font-size: 9px; color: #d080d0; }
.mon-placeholder {
    width: 56px; height: 56px;
    background: rgba(255,255,255,0.06); border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #555;
}

/* Section header per player */
.player-section { margin-bottom: 28px; }
.player-title {
    font-size: 13px; font-weight: 700; color: #bbb;
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
}
.player-count { font-size: 11px; color: #666; font-weight: normal; }
</style>
</head>
<body>
<div id="root">
  <div class="page-header">
    <div class="page-title">🪦 Memorial</div>
    <div class="run-selector">
      Run:&nbsp;<select id="run-select"></select>
    </div>
    <a class="back-link" href="/history">← History</a>
  </div>
  <div id="content"><div class="waiting">Connecting…</div></div>
</div>
<script>
const WS_URL = 'ws://' + location.host + '/ws?show=memorial';
let currentRunId = null;
let allSlots = [];

function runIdFromUrl() {
    const m = location.pathname.match(/\/run\/(\d+)\/memorial/);
    if (m) return parseInt(m[1]);
    return parseInt(new URLSearchParams(location.search).get('run') || '0') || null;
}
currentRunId = runIdFromUrl();

document.getElementById('run-select').addEventListener('change', e => {
    currentRunId = parseInt(e.target.value);
    if (location.pathname.includes('/run/')) {
        history.replaceState(null, '', '/run/' + currentRunId + '/memorial');
    } else {
        history.replaceState(null, '', '/memorial?run=' + currentRunId);
    }
    renderFromSlots(allSlots);
});

function renderFromSlots(slots) {
    allSlots = slots;
    const root = document.getElementById('content');

    // Collect dead Pokémon across all connected slots
    const byPlayer = {};
    for (const slot of slots) {
        if (!slot.connected && !slot.db_connected) continue;
        const player = slot.label || 'Player';
        const dead = slot.dead || [];
        // Filter by run if a specific run is requested
        // (WS data is already filtered to the active run — for historical runs
        //  the page refreshes from the DB via the run selector)
        if (!byPlayer[player]) byPlayer[player] = [];
        byPlayer[player].push(...dead);
    }

    const players = Object.keys(byPlayer);
    if (!players.length) {
        root.innerHTML = '<div class="empty">No deaths recorded yet. The party lives on! 🎉</div>';
        return;
    }

    let html = '';
    for (const player of players) {
        const dead = byPlayer[player];
        // Sort newest last (died_at ascending — oldest first, memorial reads chronologically)
        dead.sort((a, b) => {
            const da = a.died_at || '', db2 = b.died_at || '';
            return da < db2 ? -1 : da > db2 ? 1 : 0;
        });

        html += `<div class="player-section">`;
        if (players.length > 1) {
            html += `<div class="player-title">${esc(player)} <span class="player-count">${dead.length} fallen</span></div>`;
        }
        html += `<div class="memorial-grid">`;

        for (const dp of dead) {
            const shinyClass  = dp.shiny     ? ' shiny'     : '';
            const slClass     = dp.soul_link ? ' soul-link' : '';
            const spriteClass = dp.shiny     ? ' shiny-sprite' : '';
            const sprite = dp.sprite
                ? `<img class="mon-sprite${spriteClass}" src="${dp.sprite}" alt="${esc(dp.species_name)}">`
                : `<div class="mon-placeholder">💀</div>`;
            const shinyMark = dp.shiny     ? '<span class="shiny-star">✨</span> ' : '';
            const slMark    = dp.soul_link ? '<span class="sl-icon">🔗</span> ' : '';
            const loc = dp.died_at ? dp.died_at.split(' ')[0] : '';
            html += `<div class="mon-card${shinyClass}${slClass}" title="${esc(dp.died_at)}">
  ${sprite}
  <div class="mon-name">${shinyMark}${slMark}${esc(dp.nickname)}</div>
  <div class="mon-species">${esc(dp.species_name)}</div>
  <div class="mon-level">Lv.${dp.level}</div>
  <div class="mon-date">${loc}</div>
</div>`;
        }

        html += '</div></div>';
    }

    root.innerHTML = html;
}

function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Populate run selector from DB
fetch('/db.json').then(r => r.json()).then(db => {
    if (!db.runs) return;
    const sel = document.getElementById('run-select');
    sel.innerHTML = '';
    const sorted = [...db.runs].sort((a, b) => b.id - a.id);
    for (const r of sorted) {
        const opt = document.createElement('option');
        opt.value = r.id;
        opt.textContent = 'Run #' + r.id + ' — ' + r.player + (!r.ended ? ' (active)' : '');
        sel.appendChild(opt);
    }
    if (currentRunId) sel.value = currentRunId;
    else if (sorted.length) { currentRunId = sorted[0].id; sel.value = currentRunId; }
}).catch(() => {});

// WebSocket for live data
let ws;
let reconnectDelay = 1000;
function connect() {
    ws = new WebSocket(WS_URL);
    ws.onopen    = () => { reconnectDelay = 1000; };
    ws.onmessage = e => renderFromSlots(JSON.parse(e.data));
    ws.onclose   = () => { setTimeout(connect, reconnectDelay); reconnectDelay = Math.min(reconnectDelay * 2, 30000); };
}
connect();
</script>
</body>
</html>

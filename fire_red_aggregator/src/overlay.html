<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FireRed Overlay</title>
<!-- THEME_SLOT -->
<style>
:root {
    --bg-panel:         rgba(15, 15, 15, 0.88);
    --bg-dead:          rgba(90, 0, 0, 0.45);
    --bg-shiny:         rgba(60, 30, 0, 0.5);
    --color-text:       #fff;
    --color-sub:        #ccc;
    --color-sub-sm:     #bbb;
    --color-muted:      #aaa;
    --color-ok:         #60e060;
    --color-warn:       #ffd040;
    --color-danger:     #e06060;
    --color-dead:       #c06060;
    --color-badge-off:  #555;
    --color-soullink:   #d060d0;
    --color-hp-high:    #fff;
    --color-hp-mid:     #ffe040;
    --color-hp-low:     #ff5050;
    --border-divider:   rgba(255,255,255,0.2);
    --border-subtle:    rgba(255,255,255,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    width: 100%; height: 100%;
    background: transparent;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: var(--color-text);
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
}
#root {
    display: flex;
    flex-wrap: nowrap;
    gap: 8px;
    padding: 8px;
    align-items: flex-start;
    width: 100%;
}
.col {
    background: var(--bg-panel);
    border-radius: 10px;
    padding: 8px 10px;
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.heading {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    font-weight: bold;
    border-bottom: 1px solid var(--border-divider);
    padding-bottom: 5px;
    margin-bottom: 2px;
}
.db-indicator { font-size: 10px; color: var(--color-ok); font-weight: normal; }
.disconnected { color: var(--color-danger); font-size: 14px; padding: 6px 0; }
.badges {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--color-sub);
}
.badge-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
}
.badge-dot.on  { background: var(--color-ok); }
.badge-dot.off { background: var(--color-badge-off); }
.next-gym { font-size: 11px; color: var(--color-warn); font-weight: 600; }

/* soul-link annotation above the pokemon row */
.soul-link-ann {
    font-size: 11px;
    color: var(--color-soullink);
    font-weight: 600;
    margin-bottom: 2px;
}

.mon {
    padding: 4px 0;
    border-bottom: 1px solid var(--border-subtle);
}
.mon.dead { background: var(--bg-dead); border-radius: 4px; padding: 4px 5px; }

/* sprite + text side-by-side */
.mon-inner {
    display: flex;
    align-items: flex-start;
    gap: 6px;
}
.mon-sprite {
    width: 64px;
    height: 64px;
    image-rendering: pixelated;
    flex-shrink: 0;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9)) drop-shadow(0 0 6px rgba(255,255,255,0.35));
}
.mon.dead .mon-sprite {
    filter: grayscale(100%) brightness(0.5);
}
.mon-content { flex: 1; min-width: 0; }

.mon-name-row {
    display: flex;
    align-items: center;
    gap: 5px;
    font-weight: bold;
    font-size: 14px;
}
.mon.dead .mon-name-row { color: var(--color-dead); }
.dead-badge { color: var(--color-hp-low); font-size: 11px; font-weight: bold; }
.lv { color: var(--color-sub); font-size: 11px; font-weight: 600; }
.shiny { font-size: 12px; }
.mon-sub { font-size: 11px; color: var(--color-sub); font-weight: 500; margin-top: 1px; }
.mon-sub-sm { font-size: 10px; color: var(--color-sub-sm); font-weight: 500; margin-top: 1px; }
.hp { font-size: 13px; font-weight: 600; margin-top: 1px; }
.hp-high { color: var(--color-hp-high); }
.hp-mid  { color: var(--color-hp-mid); }
.hp-low  { color: var(--color-hp-low); }
.exp { font-size: 10px; color: var(--color-muted); font-weight: 500; margin-top: 1px; }
.enc-section {
    margin-top: 6px;
    border-top: 1px solid var(--border-divider);
    padding-top: 4px;
}
.enc-heading { font-size: 11px; color: var(--color-sub); font-style: italic; font-weight: 600; margin-bottom: 3px; }
.enc-row { display: flex; flex-wrap: wrap; gap: 4px; }
.enc-mon {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
}
.enc-sprite { width: 52px; height: 52px; image-rendering: pixelated; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9)) drop-shadow(0 0 6px rgba(255,255,255,0.35)); }
.enc-lv { font-size: 9px; color: var(--color-sub-sm); font-weight: 600; text-align: center; }
.run-ended-summary {
    margin: 6px 0 2px;
    padding: 6px 8px;
    background: var(--bg-shiny);
    border-radius: 6px;
    font-size: 11px;
    color: var(--color-sub);
    line-height: 1.6;
}
.run-ended-summary .summary-title {
    font-size: 13px;
    font-weight: bold;
    color: #e09040;
    margin-bottom: 3px;
}
.db-enc-section { margin-top: 6px; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 4px; }
.db-enc-heading { font-size: 11px; color: #ccc; font-style: italic; font-weight: 600; margin-bottom: 3px; }
.db-enc-row { display: flex; flex-wrap: wrap; gap: 4px; }
.db-enc-mon { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.db-enc-sprite { width: 52px; height: 52px; image-rendering: pixelated; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9)) drop-shadow(0 0 6px rgba(255,255,255,0.35)); }
.db-enc-sprite.failed { filter: grayscale(80%) brightness(0.6); }
.db-enc-label { font-size: 9px; color: #bbb; font-weight: 600; text-align: center; }
.db-enc-label.caught-yes { color: #60e060; }
.db-enc-label.caught-no  { color: #e06060; }
.run-controls {
    display: flex;
    gap: 4px;
    margin-left: auto;
}
.run-btn {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    color: #fff;
    text-shadow: none;
}
.run-btn.end { background: #8b2020; }
.run-btn.end:hover { background: #b02828; }
.run-btn.new  { background: #1a6b1a; }
.run-btn.new:hover  { background: #228b22; }
.gender-m { color: #64a0ff; font-size: 12px; font-weight: bold; }
.gender-f { color: #ff82b4; font-size: 12px; font-weight: bold; }
.nat-up   { color: #ff99cc; }
.nat-down { color: #9ec8ff; }
.status-badge {
    display: inline-block; font-size: 9px; font-weight: bold;
    padding: 1px 4px; border-radius: 3px; margin-left: 4px;
    vertical-align: middle; text-shadow: none;
}
.status-slp { background: #555577; color: #ccccee; }
.status-psn { background: #7733aa; color: #ddb8ff; }
.status-brn { background: #aa4400; color: #ffcc99; }
.status-frz { background: #336688; color: #aaddff; }
.status-par { background: #887700; color: #ffee88; }
.status-tox { background: #550077; color: #dd99ff; }
#version-badge {
    position: fixed; top: 4px; right: 6px;
    font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.75);
    background: rgba(0,0,0,0.45); border-radius: 4px; padding: 1px 5px;
    pointer-events: none; z-index: 9999;
}
.box-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 4px; }
.box-heading { font-size: 11px; color: #ccc; font-style: italic; font-weight: 600; margin: 6px 0 3px; }
.box-slot {
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    padding: 3px 2px; border-radius: 4px; background: rgba(255,255,255,0.05); min-width: 0;
}
.box-slot.shiny { background: rgba(255,215,0,0.1); }
.box-slot.egg   { background: rgba(100,180,100,0.1); }
.box-sprite { width: 52px; height: 52px; image-rendering: pixelated; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9)) drop-shadow(0 0 6px rgba(255,255,255,0.35)); }
.box-name { font-size: 9px; color: #ddd; font-weight: 600; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; }
.box-nature { font-size: 8px; color: #aaa; text-align: center; }
.box-ivs { font-size: 8px; color: #bbb; text-align: center; }
.iv-p     { color: #ffd040; }
.iv-z     { color: #e06060; }
.iv-label { color: rgba(200,200,200,0.45); }
.moves-row   { display: flex; flex-wrap: wrap; gap: 2px 6px; margin-top: 2px; }
.move-entry  { font-size: 10px; color: #b0d0ff; font-weight: 500; }
.prev-hint   { font-size: 10px; color: #d0a860; font-style: italic; margin-bottom: 2px; }
/* ── light theme ──────────────────────────────────────────────────────── */
html[data-theme=light],html[data-theme=light] body{color:#111;text-shadow:none}
html[data-theme=light] .col{background:rgba(238,238,238,.93);border:1px solid rgba(0,0,0,.12)}
html[data-theme=light] .heading{border-bottom-color:rgba(0,0,0,.15)}
html[data-theme=light] .mon{border-bottom-color:rgba(0,0,0,.1)}
html[data-theme=light] .badges{color:#444}
html[data-theme=light] .lv,html[data-theme=light] .mon-sub,html[data-theme=light] .mon-sub-sm{color:#444}
html[data-theme=light] .exp,html[data-theme=light] .enc-lv,html[data-theme=light] .enc-heading,html[data-theme=light] .db-enc-heading,html[data-theme=light] .db-enc-label{color:#555}
html[data-theme=light] .disconnected{color:#cc2200}
html[data-theme=light] .db-indicator{color:#007700}
html[data-theme=light] .next-gym{color:#996600}
html[data-theme=light] .soul-link-ann{color:#880088}
html[data-theme=light] .hp-high{color:#111}
html[data-theme=light] .hp-mid{color:#996600}
html[data-theme=light] .hp-low{color:#cc2200}
html[data-theme=light] .enc-section{border-top-color:rgba(0,0,0,.12)}
html[data-theme=light] .db-enc-section{border-top-color:rgba(0,0,0,.12)}
html[data-theme=light] .run-ended-summary{background:rgba(180,120,0,.12);color:#333}
html[data-theme=light] .run-ended-summary .summary-title{color:#994400}
html[data-theme=light] #version-badge{color:rgba(0,0,0,.6);background:rgba(255,255,255,.8)}
html[data-theme=light] .mon.dead{background:rgba(220,50,50,.12)}
html[data-theme=light] .mon.dead .mon-name-row,html[data-theme=light] .dead-badge{color:#cc2200}
html[data-theme=light] .gender-m{color:#1144cc}
html[data-theme=light] .gender-f{color:#cc2266}
html[data-theme=light] .nat-up{color:#cc0066}
html[data-theme=light] .nat-down{color:#0055cc}
html[data-theme=light] .badge-dot.off{background:#aaa}
html[data-theme=light] .box-heading,html[data-theme=light] .box-nature,html[data-theme=light] .box-ivs{color:#555}
html[data-theme=light] .box-name{color:#222}
html[data-theme=light] .box-slot{background:rgba(0,0,0,.06)}
html[data-theme=light] .box-slot.shiny{background:rgba(180,140,0,.15)}
html[data-theme=light] .box-slot.egg{background:rgba(0,120,0,.12)}
html[data-theme=light] .move-entry{color:#2244aa}
html[data-theme=light] .prev-hint{color:#884400}
/* ── minimal theme ────────────────────────────────────────────────────── */
html[data-theme=minimal] .col{background:rgba(0,0,0,.55);border-radius:6px}
html[data-theme=minimal] .mon-sprite,html[data-theme=minimal] .enc-sprite,html[data-theme=minimal] .db-enc-sprite,html[data-theme=minimal] .box-sprite{filter:drop-shadow(0 1px 2px rgba(0,0,0,.85))}
</style>

<body>
<div id="version-badge">v__VERSION__</div>
<div id="root"></div>
<script>
(function(){if(!new URLSearchParams(window.location.search).has('run')){var t=localStorage.getItem('frt_session');if(t){fetch('/api/me/active_run',{headers:{'Authorization':'Bearer '+t}}).then(function(r){return r.ok?r.json():null;}).then(function(d){if(d&&d.run_id){var sp=new URLSearchParams(window.location.search);sp.set('run',d.run_id);window.location.replace(window.location.pathname+'?'+sp.toString());}}).catch(function(){});}}})();
(function(){const t=new URLSearchParams(window.location.search).get('theme');if(t==='light'||t==='minimal'||t==='dark')document.documentElement.dataset.theme=t;}());
const READONLY   = !new URLSearchParams(window.location.search).has('manage');
const SHOW_PARAM = new URLSearchParams(window.location.search).get('show');
const RUN_PARAM  = parseInt(new URLSearchParams(window.location.search).get('run') || '0') || null;
const SHOW_BOX    = SHOW_PARAM === 'box';
const SHOW_DEAD   = SHOW_PARAM === 'dead';
const SHOW_CAUGHT = SHOW_PARAM === 'caught';

let ws;
let reconnectDelay = 1000;
function connect() {
    const wsPath = SHOW_PARAM ? '/ws?show=' + encodeURIComponent(SHOW_PARAM) : '/ws';
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + wsPath);
    ws.onopen    = () => { reconnectDelay = 1000; };
    ws.onmessage = e => render(JSON.parse(e.data));
    ws.onclose   = () => { setTimeout(connect, reconnectDelay); reconnectDelay = Math.min(reconnectDelay * 2, 30000); };
}
connect();

function sendCmd(cmd, slot) {
    if (!READONLY && ws && ws.readyState === WebSocket.OPEN)
        ws.send(JSON.stringify({ cmd, slot }));
}

// Per-slot JSON cache: only rebuild a column element when its data changes.
// This prevents root.innerHTML = '' on every tick, which caused visible flicker
// and discarded CSS transitions on the party sprites.
const slotCache = [];

function render(slots) {
    const root = document.getElementById('root');

    const visible = RUN_PARAM
        ? slots.filter(s => s.active_run_id === RUN_PARAM)
        : slots;

    // Drop extra columns when a slot disconnects or run filter reduces count
    while (root.children.length > visible.length) root.removeChild(root.lastChild);

    for (let i = 0; i < visible.length; i++) {
        const json = JSON.stringify(visible[i]);
        if (slotCache[i] === json && root.children[i]) continue;
        slotCache[i] = json;

        const col = buildCol(visible[i], i);
        if (root.children[i]) {
            root.replaceChild(col, root.children[i]);
        } else {
            root.appendChild(col);
        }
    }

    if (RUN_PARAM && visible.length === 0 && root.children.length === 0) {
        const msg = el('div', 'disconnected', 'Run #' + RUN_PARAM + ' is not active on any connected tracker.');
        root.appendChild(msg);
    }
}

function buildCol(slot, slotIndex) {
    const col = el('div', 'col');

    const hd = el('div', 'heading');
    hd.appendChild(document.createTextNode(slot.label));
    if (slot.db_connected) {
        const runLabel = slot.active_run_id != null
            ? '● Run #' + slot.active_run_id
            : '● No active run';
        const ind = el('span', 'db-indicator', runLabel);
        if (slot.active_run_id == null) ind.style.color = '#e09040';
        hd.appendChild(ind);
    }

    if (!READONLY) {
        const controls = el('div', 'run-controls');
        const endBtn = el('button', 'run-btn end', 'End Run');
        endBtn.disabled = slot.active_run_id == null;
        endBtn.onclick = () => {
            if (confirm('End the current run for all connected players?'))
                sendCmd('end_run', 0);
        };
        const newBtn = el('button', 'run-btn new', 'New Run');
        newBtn.onclick = () => {
            if (confirm('Start a new run for all connected players?'))
                sendCmd('new_run', 0);
        };
        controls.appendChild(endBtn);
        controls.appendChild(newBtn);
        hd.appendChild(controls);
    }

    col.appendChild(hd);

        if (!slot.connected && slot.active_run_id == null && slot.run_summary) {
            renderRunEnded(col, slot);
        } else if (!slot.connected) {
            col.appendChild(el('div', 'disconnected', '⚠ Disconnected'));
        } else if (slot.active_run_id == null && slot.run_summary) {
            renderRunEnded(col, slot);
        } else {
            if (SHOW_BOX) {
                buildBoxContent(col, slot);
            } else if (SHOW_DEAD) {
                buildDeadContent(col, slot);
            } else if (SHOW_CAUGHT) {
                buildCaughtContent(col, slot);
            } else {
            const brow = el('div', 'badges');
            brow.appendChild(document.createTextNode('Badges: ' + slot.badges.filter(Boolean).length + '/8  '));
            for (const obtained of slot.badges) {
                brow.appendChild(el('span', 'badge-dot ' + (obtained ? 'on' : 'off')));
            }
            col.appendChild(brow);

            if (slot.next_gym) {
                const g = slot.next_gym;
                const gymType = GYM_TYPES[g.leader] ? ' [' + GYM_TYPES[g.leader] + ']' : '';
                col.appendChild(el('div', 'next-gym',
                    'Next: ' + g.leader + gymType + ' (' + g.city + ') — Lv.' + g.max_level));
            }

            for (const mon of slot.party) {
                const mdiv = el('div', 'mon' + (mon.dead ? ' dead' : ''));

                // Soul-link partner annotation (shown above the row)
                if (mon.soul_link_partner) {
                    const p = mon.soul_link_partner;
                    mdiv.appendChild(el('div', 'soul-link-ann',
                        'Soul-link: ' + p.nickname + ' (' + p.player + ')'));
                }

                const inner = el('div', 'mon-inner');

                // Sprite — embedded as a base64 data URI in the JSON, so no
                // HTTP request needed and no browser caching issues.
                if (mon.sprite) {
                    const img = document.createElement('img');
                    img.className = 'mon-sprite';
                    img.src = mon.sprite;
                    inner.appendChild(img);
                }

                const content = el('div', 'mon-content');

                const nr = el('div', 'mon-name-row');
                nr.appendChild(document.createTextNode(mon.nickname));
                const gs = genderSym(mon.gender);
                if (gs.sym) nr.appendChild(el('span', gs.cls, gs.sym));
                if (mon.shiny) nr.appendChild(el('span', 'shiny', '✨'));
                if (mon.dead) {
                    nr.appendChild(el('span', 'dead-badge', 'DEAD'));
                } else {
                    nr.appendChild(el('span', 'lv', 'Lv' + mon.level));
                }
                const sb = statusBadgeEl(mon.status);
                if (sb) nr.appendChild(sb);
                content.appendChild(nr);

                if (mon.dead) {
                    content.appendChild(el('div', 'mon-sub',
                        'Lv.' + mon.level + ' ' + mon.species_name + ' — ' + mon.nature +
                        (mon.shiny ? ' ★' : '')));

                    if (mon.soul_link_kill) {
                        content.appendChild(el('div', 'mon-sub', 'Soul Link'));
                    } else if (mon.attack > 0) {
                        content.appendChild(statRowEl('mon-sub-sm', mon.nature, mon.max_hp, mon.attack, mon.defense, mon.speed, mon.sp_attack, mon.sp_defense));
                    }
                    if (mon.died_at) {
                        content.appendChild(el('div', 'mon-sub-sm', 'Died: ' + mon.died_at));
                    }
                    if (mon.ability) content.appendChild(el('div', 'mon-sub-sm', 'Ability: ' + mon.ability));
                    if (mon.held_item && mon.held_item !== 'None') content.appendChild(el('div', 'mon-sub-sm', 'Held: ' + mon.held_item));
                    if (mon.growth_rate) content.appendChild(el('div', 'mon-sub-sm', 'Growth: ' + mon.growth_rate));
                    if (mon.ev_hp != null) content.appendChild(evRowEl('mon-sub-sm', mon.ev_hp, mon.ev_atk, mon.ev_def, mon.ev_spe, mon.ev_spa, mon.ev_spd));
                } else {
                    content.appendChild(el('div', 'mon-sub',
                        mon.species_name + ' — ' + mon.nature + (mon.shiny ? ' ★' : '')));
                    const ratio = mon.max_hp > 0 ? mon.hp / mon.max_hp : 0;
                    const cls   = ratio < 0.3 ? 'hp-low' : ratio < 0.8 ? 'hp-mid' : 'hp-high';
                    content.appendChild(el('div', 'hp ' + cls, mon.hp + '/' + mon.max_hp));
                    content.appendChild(statRowEl('mon-sub-sm', mon.nature, mon.max_hp, mon.attack, mon.defense, mon.speed, mon.sp_attack, mon.sp_defense));
                    content.appendChild(el('div', 'exp', 'Exp: ' + mon.exp));
                    if (mon.ability) content.appendChild(el('div', 'mon-sub-sm', 'Ability: ' + mon.ability));
                    if (mon.held_item && mon.held_item !== 'None') content.appendChild(el('div', 'mon-sub-sm', 'Held: ' + mon.held_item));
                    if (mon.growth_rate) content.appendChild(el('div', 'mon-sub-sm', 'Growth: ' + mon.growth_rate));
                    if (mon.ev_hp != null) content.appendChild(evRowEl('mon-sub-sm', mon.ev_hp, mon.ev_atk, mon.ev_def, mon.ev_spe, mon.ev_spa, mon.ev_spd));
                    if (mon.moves && mon.moves.some(m => m && m !== '—')) {
                        const movesDiv = el('div', 'moves-row');
                        for (let mi = 0; mi < 4; mi++) {
                            const name = mon.moves[mi];
                            if (!name || name === '—') continue;
                            movesDiv.appendChild(el('span', 'move-entry', name + ' ' + mon.pp[mi]));
                        }
                        content.appendChild(movesDiv);
                    }
                }

                inner.appendChild(content);
                mdiv.appendChild(inner);
                col.appendChild(mdiv);
            }
            // Encounter section
            if (slot.encounters && slot.encounters.length > 0) {
                const encSec = el('div', 'enc-section');
                if (slot.prev_run_encounters && slot.prev_run_encounters.length > 0) {
                    const prevMatch = slot.prev_run_encounters.find(
                        e => e.map_group === slot.current_map_group && e.map_name === slot.current_map_name);
                    if (prevMatch) {
                        const note = prevMatch.caught
                            ? 'Last run: ' + prevMatch.species_name + ' Lv.' + prevMatch.level + ' caught'
                            : 'Last run: ' + prevMatch.species_name + ' Lv.' + prevMatch.level + ' fled';
                        encSec.appendChild(el('div', 'prev-hint', note));
                    }
                }
                for (const group of slot.encounters) {
                    encSec.appendChild(el('div', 'enc-heading', group.label));
                    const row = el('div', 'enc-row');
                    for (const mon of group.mons) {
                        const mdiv = el('div', 'enc-mon');
                        if (mon.sprite) {
                            const img = document.createElement('img');
                            img.className = 'enc-sprite';
                            img.src = mon.sprite;
                            mdiv.appendChild(img);
                        }
                        row.appendChild(mdiv);
                    }
                    encSec.appendChild(row);
                }
                col.appendChild(encSec);
            }
            } // end show branch
        }
        return col;
}

function renderRunEnded(col, slot) {
    const s = slot.run_summary;
    const summary = el('div', 'run-ended-summary');
    summary.appendChild(el('div', 'summary-title', 'Run #' + s.run_id + ' ended'));
    summary.appendChild(el('div', null, 'Player: ' + s.player_name));
    summary.appendChild(el('div', null, 'Started: ' + s.started_at));
    if (s.ended_at) summary.appendChild(el('div', null, 'Ended: ' + s.ended_at));
    summary.appendChild(el('div', null, 'Caught: ' + s.caught + '  |  Deaths: ' + s.deaths));
    col.appendChild(summary);

    if (slot.db_encounters && slot.db_encounters.length > 0) {
        const sec = el('div', 'db-enc-section');
        sec.appendChild(el('div', 'db-enc-heading', 'First encounters'));
        const row = el('div', 'db-enc-row');
        for (const enc of slot.db_encounters) {
            const mdiv = el('div', 'db-enc-mon');
            if (enc.sprite) {
                const img = document.createElement('img');
                img.className = 'db-enc-sprite' + (enc.caught ? '' : ' failed');
                img.src = enc.sprite;
                mdiv.appendChild(img);
            }
            mdiv.appendChild(el('div', 'db-enc-label ' + (enc.caught ? 'caught-yes' : 'caught-no'),
                enc.species_name + (enc.caught ? ' ✓' : ' ✗')));
            row.appendChild(mdiv);
        }
        sec.appendChild(row);
        col.appendChild(sec);
    }
}

const NATURE_MODS = {
    'Lonely':  { up: 'Atk', down: 'Def' }, 'Brave':   { up: 'Atk', down: 'Spe' },
    'Adamant': { up: 'Atk', down: 'SpA' }, 'Naughty': { up: 'Atk', down: 'SpD' },
    'Bold':    { up: 'Def', down: 'Atk' }, 'Relaxed': { up: 'Def', down: 'Spe' },
    'Impish':  { up: 'Def', down: 'SpA' }, 'Lax':     { up: 'Def', down: 'SpD' },
    'Timid':   { up: 'Spe', down: 'Atk' }, 'Hasty':   { up: 'Spe', down: 'Def' },
    'Jolly':   { up: 'Spe', down: 'SpA' }, 'Naive':   { up: 'Spe', down: 'SpD' },
    'Modest':  { up: 'SpA', down: 'Atk' }, 'Mild':    { up: 'SpA', down: 'Def' },
    'Quiet':   { up: 'SpA', down: 'Spe' }, 'Rash':    { up: 'SpA', down: 'SpD' },
    'Calm':    { up: 'SpD', down: 'Atk' }, 'Gentle':  { up: 'SpD', down: 'Def' },
    'Sassy':   { up: 'SpD', down: 'Spe' }, 'Careful': { up: 'SpD', down: 'SpA' },
};

const GYM_TYPES = {
    'Brock':     'Rock',
    'Misty':     'Water',
    'Lt. Surge': 'Electric',
    'Erika':     'Grass',
    'Koga':      'Poison',
    'Sabrina':   'Psychic',
    'Blaine':    'Fire',
    'Giovanni':  'Ground',
    'Lorelei':   'Ice',
    'Bruno':     'Fighting',
    'Agatha':    'Ghost',
    'Lance':     'Dragon',
};

function statRowEl(cls, nature, hp, atk, def, spe, spa, spd) {
    const d = el('div', cls);
    const mods = NATURE_MODS[nature] || {};
    const stats = [['HP', hp], ['Atk', atk], ['Def', def], ['Spe', spe], ['SpA', spa], ['SpD', spd]];
    for (let i = 0; i < stats.length; i++) {
        if (i > 0) d.appendChild(document.createTextNode(' | '));
        const [lbl, val] = stats[i];
        const s = document.createElement('span');
        if (lbl === mods.up) s.className = 'nat-up';
        else if (lbl === mods.down) s.className = 'nat-down';
        s.textContent = lbl + ' ' + val;
        d.appendChild(s);
    }
    return d;
}

function evRowEl(cls, hp, atk, def, spe, spa, spd) {
    const d = el('div', cls);
    const stats = [['HP', hp], ['Atk', atk], ['Def', def], ['Spe', spe], ['SpA', spa], ['SpD', spd]];
    for (let i = 0; i < stats.length; i++) {
        if (i > 0) d.appendChild(document.createTextNode(' | '));
        const [lbl, val] = stats[i];
        const s = document.createElement('span');
        if (val === 252) s.style.color = '#ffd040';
        s.textContent = lbl + ' ' + val;
        d.appendChild(s);
    }
    return d;
}

function statusBadgeEl(status) {
    if (!status) return null;
    let label, cls;
    if      (status & 0x07) { label = 'SLP'; cls = 'status-slp'; }
    else if (status & 0x80) { label = 'TOX'; cls = 'status-tox'; }
    else if (status & 0x08) { label = 'PSN'; cls = 'status-psn'; }
    else if (status & 0x10) { label = 'BRN'; cls = 'status-brn'; }
    else if (status & 0x20) { label = 'FRZ'; cls = 'status-frz'; }
    else if (status & 0x40) { label = 'PAR'; cls = 'status-par'; }
    else return null;
    return el('span', 'status-badge ' + cls, label);
}

function genderSym(g) {
    if (g === 0) return { sym: '♂', cls: 'gender-m' };
    if (g === 1) return { sym: '♀', cls: 'gender-f' };
    return { sym: '', cls: '' };
}

function el(tag, cls, txt) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt !== undefined) e.textContent = txt;
    return e;
}

const IV_LABELS = ['HP', 'Atk', 'Def', 'Spe', 'SpA', 'SpD'];

function ivEl(v) {
    const s = document.createElement('span');
    if (v === 31) s.className = 'iv-p';
    else if (v === 0) s.className = 'iv-z';
    s.textContent = v;
    return s;
}

function ivRowEl(cls, label, hp, atk, def, spe, spa, spd, labeled) {
    const d = el('div', cls);
    if (label) d.appendChild(document.createTextNode(label + ' '));
    const vals = [hp, atk, def, spe, spa, spd];
    for (let i = 0; i < vals.length; i++) {
        if (i > 0) d.appendChild(document.createTextNode(labeled ? ' ' : '/'));
        if (labeled) {
            const lbl = document.createElement('span');
            lbl.className = 'iv-label';
            lbl.textContent = IV_LABELS[i] + ':';
            d.appendChild(lbl);
        }
        d.appendChild(ivEl(vals[i]));
    }
    return d;
}

function buildBoxContent(col, slot) {
    if (!slot.box_pokemon || slot.box_pokemon.length === 0) {
        col.appendChild(el('div', 'disconnected', 'No Pokémon in boxes'));
        return;
    }
    const byBox = {};
    for (const mon of slot.box_pokemon) {
        if (!byBox[mon.box_index]) byBox[mon.box_index] = [];
        byBox[mon.box_index].push(mon);
    }
    for (const boxIdx of Object.keys(byBox).sort((a, b) => a - b)) {
        col.appendChild(el('div', 'box-heading', 'Box ' + (parseInt(boxIdx) + 1)));
        const grid = el('div', 'box-grid');
        for (const mon of byBox[boxIdx]) {
            const cls = 'box-slot' + (mon.is_egg ? ' egg' : mon.is_shiny ? ' shiny' : '');
            const cell = el('div', cls);
            if (mon.sprite) {
                const img = document.createElement('img');
                img.className = 'box-sprite';
                img.src = mon.sprite;
                cell.appendChild(img);
            }
            const gs = genderSym(mon.gender);
            const label = mon.is_egg ? 'Egg' : mon.nickname || mon.species_name;
            cell.appendChild(el('div', 'box-name', label + (mon.is_shiny ? ' ✨' : '') + (gs.sym ? ' ' + gs.sym : '')));
            if (!mon.is_egg) {
                cell.appendChild(el('div', 'box-nature', mon.nature));
                cell.appendChild(ivRowEl('box-ivs', null, mon.iv_hp, mon.iv_atk, mon.iv_def, mon.iv_spe, mon.iv_spa, mon.iv_spd));
            }
            grid.appendChild(cell);
        }
        col.appendChild(grid);
    }
}

function buildDeadContent(col, slot) {
    if (!slot.dead || slot.dead.length === 0) {
        col.appendChild(el('div', 'disconnected', 'No deaths recorded'));
        return;
    }
    for (const mon of slot.dead) {
        const mdiv = el('div', 'mon dead');
        const inner = el('div', 'mon-inner');
        if (mon.sprite) {
            const img = document.createElement('img');
            img.className = 'mon-sprite';
            img.src = mon.sprite;
            inner.appendChild(img);
        }
        const content = el('div', 'mon-content');
        const nr = el('div', 'mon-name-row');
        nr.appendChild(document.createTextNode(mon.nickname));
        const gs = genderSym(mon.gender);
        if (gs.sym) nr.appendChild(el('span', gs.cls, gs.sym));
        if (mon.shiny) nr.appendChild(el('span', 'shiny', '✨'));
        content.appendChild(nr);
        content.appendChild(el('div', 'mon-sub',
            'Lv.' + mon.level + ' ' + mon.species_name + ' — ' + mon.nature + (mon.shiny ? ' ★' : '')));
        if (mon.soul_link) {
            content.appendChild(el('div', 'mon-sub-sm', 'Soul Link'));
        } else if (mon.max_hp > 0) {
            content.appendChild(statRowEl('mon-sub-sm', mon.nature, mon.max_hp, mon.attack, mon.defense, mon.speed, mon.sp_attack, mon.sp_defense));
        }
        if (mon.died_at) content.appendChild(el('div', 'mon-sub-sm', 'Died: ' + mon.died_at));
        inner.appendChild(content);
        mdiv.appendChild(inner);
        col.appendChild(mdiv);
    }
}

function buildCaughtContent(col, slot) {
    if (!slot.caught || slot.caught.length === 0) {
        col.appendChild(el('div', 'disconnected', 'No catches recorded'));
        return;
    }
    for (const mon of slot.caught) {
        const mdiv = el('div', 'mon');
        const inner = el('div', 'mon-inner');
        if (mon.sprite) {
            const img = document.createElement('img');
            img.className = 'mon-sprite';
            img.src = mon.sprite;
            inner.appendChild(img);
        }
        const content = el('div', 'mon-content');
        const nr = el('div', 'mon-name-row');
        nr.appendChild(document.createTextNode(mon.nickname));
        const gs = genderSym(mon.gender);
        if (gs.sym) nr.appendChild(el('span', gs.cls, gs.sym));
        if (mon.shiny) nr.appendChild(el('span', 'shiny', '✨'));
        nr.appendChild(el('span', 'lv', 'Lv' + mon.level));
        content.appendChild(nr);
        content.appendChild(el('div', 'mon-sub',
            mon.species_name + ' — ' + mon.nature + (mon.shiny ? ' ★' : '')));
        if (mon.met_location_name) content.appendChild(el('div', 'mon-sub-sm', mon.met_location_name));
        if (mon.caught_at) content.appendChild(el('div', 'mon-sub-sm', 'Caught: ' + mon.caught_at));
        inner.appendChild(content);
        mdiv.appendChild(inner);
        col.appendChild(mdiv);
    }
}

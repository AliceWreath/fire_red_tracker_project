name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Zig
        run: pip install ziglang

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binaries
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.17 -p fire_red_aggregator -p fire_red_tracker

      - name: Generate third-party license attribution
        run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html

      - name: Package binaries
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          cp ../../../THIRD_PARTY_LICENSES.html .
          tar czf fire_red_aggregator-x86_64-unknown-linux-gnu.tar.gz fire_red_aggregator THIRD_PARTY_LICENSES.html
          tar czf fire_red_tracker-x86_64-unknown-linux-gnu.tar.gz    fire_red_tracker    THIRD_PARTY_LICENSES.html

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/x86_64-unknown-linux-gnu/release/fire_red_aggregator-x86_64-unknown-linux-gnu.tar.gz
            target/x86_64-unknown-linux-gnu/release/fire_red_tracker-x86_64-unknown-linux-gnu.tar.gz

      - name: Prune old releases (keep 3 most recent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,createdAt \
            | jq -r 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
            | xargs -r -I{} gh release delete {} --repo "$GITHUB_REPOSITORY" --yes
